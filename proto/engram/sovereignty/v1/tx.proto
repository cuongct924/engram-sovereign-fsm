syntax = "proto3";

package engram.sovereignty.v1;

option go_package = "github.com/cuongct220020/engram-sovereign-fsm/x/sovereignty/types";

// Cosmos v0.50+ msg annotations route auto signing for this service.
import "cosmos/msg/v1/msg.proto";
import "engram/sovereignty/v1/state.proto";

// Transaction msg server.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Submit a ZK re-anchoring recovery proof on-chain (serves E8/E9).
  rpc SubmitRecoveryProof(MsgSubmitRecoveryProofRequest) returns (MsgSubmitRecoveryProofResponse);

  // Locally inject a qualitative fault for fault scenarios (serves E2-E7).
  rpc InjectFault(MsgInjectFaultRequest) returns (MsgInjectFaultResponse);

  // Push a tx into forced_tx_queue (spec/core/EngramTendermint.tla:886-892);
  // the leader must include it within MAX_IGNORE_ROUNDS or its proposal is
  // rejected (IsCensoring, lines 310-315).
  rpc SubmitForcedTx(MsgSubmitForcedTxRequest) returns (MsgSubmitForcedTxResponse);
}

message MsgSubmitRecoveryProofRequest {
  option (cosmos.msg.v1.signer) = "authority";
  string authority      = 1; // Validator or rpc node submitting the proof
  bytes  zk_proof       = 2; // Raw Noir ZK proof bytes, generated off-chain
  bytes  public_inputs  = 3; // Public inputs accompanying the proof (da_receipt encoded), for VerifyZKProof
  // Celestia height where the proof's witness header chain was published.
  // Optional, NOT verified on-chain -- only a long-term audit pointer, since
  // HeaderHistory is pruned once the proof is accepted. 0 = not published.
  uint64 da_celestia_height = 4;
}

message MsgSubmitRecoveryProofResponse {} // Empty on successful ZK verification

message MsgInjectFaultRequest {
  option (cosmos.msg.v1.signer) = "sender";
  string            sender  = 1; // Experiment-environment admin account
  PeripheralMetrics fault_inputs = 2; // Fault metrics the chain is forced to honor
}

message MsgInjectFaultResponse {}

message MsgSubmitForcedTxRequest {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1; // Account requesting the forced inclusion
  bytes  tx     = 2; // Raw tx bytes to force into a block
}

message MsgSubmitForcedTxResponse {}