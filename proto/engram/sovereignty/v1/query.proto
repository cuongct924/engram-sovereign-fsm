syntax = "proto3";

package engram.sovereignty.v1;

option go_package = "github.com/cuongct220020/engram-sovereign-fsm/x/sovereignty/types";

import "engram/sovereignty/v1/state.proto";

// Query service for a node's current FSM state -- serves the E9 trace-driven
// stress test and E2 observation (not part of consensus).
service Query {
  rpc State(QueryStateRequest) returns (QueryStateResponse);

  // Dumps the tracked header history plus rt_last for the current
  // SOVEREIGN/RECOVERING interval, so an off-chain prover can build a ZK
  // re-anchoring witness against this node's tracked state without
  // reconstructing it independently (spec/README.md's §Re-anchoring).
  rpc RecoveryHeaders(QueryRecoveryHeadersRequest) returns (QueryRecoveryHeadersResponse);
}

message QueryStateRequest {}

message QueryStateResponse {
  string            fsm_state               = 1;
  uint64            safe_blocks             = 2;
  uint64            suspicious_duration     = 3;
  bool              reanchoring_proof_valid = 4;
  PeripheralMetrics metrics                 = 5;
}

message QueryRecoveryHeadersRequest {}

// QueryRecoveryHeader is the wire form of types.RecoveryHeader (mirrored
// field-for-field) -- distinct name avoids a generated-type clash.
message QueryRecoveryHeader {
  uint64 height            = 1;
  string fsm_state         = 2;
  bool   withdrawal_locked = 3;
  bytes  state_root        = 4;
}

message QueryRecoveryHeadersResponse {
  // rt_last: state root of the last ANCHORED block before this interval
  // started (empty if no interval is currently tracked).
  bytes                        last_anchored_root = 1;
  repeated QueryRecoveryHeader headers             = 2;
}
