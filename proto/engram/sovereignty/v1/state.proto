syntax = "proto3";

package engram.sovereignty.v1;

// Generated Go code lands directly in the execution layer's types package.
option go_package = "github.com/cuongct220020/engram-sovereign-fsm/x/sovereignty/types";

// Raw peripheral snapshot, 1:1 with the sensor variables of
// spec/core/EngramFSM.tla. Used by MsgInjectFault and PrepareProposal --
// don't rename fields without porting x/sovereignty/types/predicates.go.
message PeripheralMetrics {
  // Bitcoin settlement sensor.
  uint64 btc_gap = 1;
  bool   is_btc_spv_failed = 2;

  // Celestia DA sensor.
  uint64 da_gap = 3;
  bool   is_das_failed = 4;
  bool   is_attestation_failed = 5;

  // P2P tri-interface sensor.
  uint64 subnet_diversity = 6;
  uint64 active_anchors = 7;
  uint64 clean_peers = 8;
  uint64 peer_churn_rate = 9;
  uint64 avg_peer_tenure = 10;
  uint64 peer_latency = 11;
}
