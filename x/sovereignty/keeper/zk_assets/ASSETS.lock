# Toolchain (the prover and the verifier must share one build, see circuit/README.md):
#   bb      5.0.0-nightly.20260522  (AztecProtocol/aztec-packages v5.0.0-nightly.20260522, commit 87aa5283d5b0cab6632ed49fdd25f6548d2ba91f)
#   nargo   1.0.0-beta.22

# UltraHonk/BN254 verifier compiled to wasm32-wasi, run by wazero. Source: github.com/cuongct924/engram-barretenberg-wasm at
# 43a63abbb17f0643613c709ba8838a552791feb3 (re-pin to the bb release above, 2026-08-31, the day this file was committed;
# later commits there do not touch the build). Rebuild: scripts/build-wasm.sh in that repository.
