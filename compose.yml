name: engram-validator-cluster

include:
  - ./docker/bitcoin-regtest-cluster.yml
  - ./docker/bitcoin-miner-loop.yml
  - ./docker/celestia-local-cluster.yml
  - ./docker/engram-validator-cluster.yml
  - ./docker/reanchoring-prover.yml
  - ./docker/attacker-peer-swarm.yml
  - ./docker/engram-node04-double-sign.yml

services:
  # ==========================================
  # CHAOS ENGINEERING PROFILES (PUMBA)
  # ==========================================
  
  pumba-latency:
    image: gaiaadm/pumba:latest
    container_name: pumba-latency-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket for container manipulation
    profiles:
      - chaos-delay
    # SCENARIO: Inject 100ms latency (±20ms jitter) for 5m to all engram-node containers
    command: 
      - "netem"
      - "--duration=5m"
      - "delay"
      - "--time=100"
      - "--jitter=20"
      - "re2:^engram-node.*"

  pumba-loss:
    image: gaiaadm/pumba:latest
    container_name: pumba-loss-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-loss
    # SCENARIO: Packet Loss - Drop 5% of network traffic on nodes 01 and 02 for 2m
    command: 
      - "netem"
      - "--duration=2m"
      - "loss"
      - "--percent=5"
      - "engram-node01"
      - "engram-node02"

  pumba-kill:
    image: gaiaadm/pumba:latest
    container_name: pumba-crash-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-crash
    # SCENARIO: Crash Fault - Forcefully terminate node 04 immediately
    command: 
      - "kill"
      - "--signal=SIGKILL"
      - "engram-node04"

  pumba-eclipse:
    image: gaiaadm/pumba:latest
    container_name: pumba-eclipse-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-eclipse
    # SCENARIO: Eclipse Attack - Isolate node 01 by dropping 100% of its traffic for 3m
    command:
      - "netem"
      - "--duration=3m"
      - "loss"
      - "--percent=100"
      - "engram-node01"

  pumba-btc-delay:
    image: gaiaadm/pumba:latest
    container_name: pumba-btc-delay-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-btc-delay
    # BTC congestion (docs/EXPERIMENT.md's E2 S2): delay/jitter applied
    # directly to bitcoin-node01, the only RPC target every validator's
    # AnchorTracker/btcGapMetric points at (bitcoin-node02 is only
    # bitcoin-node01's regtest sync peer, never dialed by engramd). Duration
    # matched to scripts/e2_fault_injection's staged-ramp orchestration, not
    # a single fixed window.
    command:
      - "netem"
      - "--duration=2m"
      - "delay"
      - "--time=500"
      - "--jitter=100"
      - "bitcoin-node01"

  # --- WAN realism profiles (chaos-wan-latency/-loss) -------------------------
  # pumba-latency/pumba-loss above apply ONE uniform parameter to all/some
  # engram-node* containers, standing in for "the network" as a single
  # entity. These 2 profiles instead give each of the 4 real validators its
  # OWN, DIFFERENT delay/jitter and loss% -- approximating 4 geographically
  # distinct validators (e.g. node01 nearby, node03 the furthest) rather
  # than 4 containers on one LAN-like bridge. Illustrative magnitudes, not
  # measured from real geography; still real tc netem rules applied to the
  # real containers, not mocked. Does not change engram-net's actual
  # topology (see its own comment below on why real SubnetDiversity can't
  # be changed this way) -- this only makes each node's traffic BEHAVE like
  # it crossed a different real link.
  #
  # A third profile (per-node bandwidth cap via `pumba netem rate`, for
  # "congestion") was attempted and dropped: `tc qdisc add dev eth0 root
  # netem rate 5mbit` fails with exit code 2 on this Docker Desktop VM's
  # kernel (sch_netem build lacks rate-limiting support) -- confirmed via a
  # live `--log-level=debug` run, not a config mistake. Revisit with a
  # TBF/HTB qdisc instead of netem's rate extension if bandwidth-cap
  # realism is needed later; not attempted here.
  pumba-wan-latency-01:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=15", "--jitter=3", "engram-node01"]

  pumba-wan-latency-02:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-02
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=70", "--jitter=15", "engram-node02"]

  pumba-wan-latency-03:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-03
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=140", "--jitter=25", "engram-node03"]

  pumba-wan-latency-04:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=45", "--jitter=10", "engram-node04"]

  pumba-wan-loss-01:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=1", "engram-node01"]

  pumba-wan-loss-02:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-02
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=3", "engram-node02"]

  pumba-wan-loss-03:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-03
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=6", "engram-node03"]

  pumba-wan-loss-04:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=2", "engram-node04"]

networks:
  # Main validator network: all 4 real validators communicate here.
  #
  # All 4 sit on this one /24 by construction, not by oversight: real
  # SubnetDiversity (x/sovereignty/types/subnet.go's SubnetOf, computed from
  # each peer's actual connected RemoteIP, cmd/engramd/main.go's
  # PeerHealthSnapshot) can only ever read back as 1 while P2P traffic
  # between validators transits a single shared bridge network -- adding
  # each validator its own ADDITIONAL isolated subnet (for identity alone)
  # would NOT change this, since Docker bridge networks don't route to each
  # other and P2P connections would still resolve over this one. Genuinely
  # raising SubnetDiversity needs a different topology (e.g. validators
  # reaching each other over distinct pairwise-shared networks), not
  # attempted here -- MinSubnetDiversity is kept at 1 (.env.example) to
  # match, not as an aspirational floor. See the chaos-wan-* profiles below
  # for what IS simulated here: per-node distinct network CONDITIONS
  # (latency/loss/bandwidth), independent of this topology limitation.
  engram-net:
    name: engram-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-engram"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  # Bitcoin network: Isolated environment for the Bitcoin regtest RPC cluster
  bitcoin-net:
    name: bitcoin-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-bitcoin"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  # Celestia network: Isolated environment for Celestia DA layer
  celestia-net:
    name: celestia-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-celestia"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

  # attacker-subnet-a/b/c/d: 4 distinct bridge networks for E4/E8's A2
  # (Sybil via simulated multi-subnet swarm, docker/attacker-peer-swarm.yml).
  # engram-net's own 4 validators sit on one /24 by construction (see
  # MinSubnetDiversity's doc in x/sovereignty/types/params.go) -- these give
  # an attacker swarm genuine multi-subnet diversity to test the real
  # ingress filter (FilterPeerByAddr) against.
  attacker-subnet-a:
    name: attacker-subnet-a
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  attacker-subnet-b:
    name: attacker-subnet-b
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
  attacker-subnet-c:
    name: attacker-subnet-c
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24
          gateway: 172.32.0.1
  attacker-subnet-d:
    name: attacker-subnet-d
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
          gateway: 172.33.0.1