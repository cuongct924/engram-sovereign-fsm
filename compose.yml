name: engram-validator-cluster

include:
  - ./docker/bitcoin-regtest-cluster.yml
  - ./docker/bitcoin-miner-loop.yml
  - ./docker/celestia-local-cluster.yml
  - ./docker/engram-validator-cluster.yml
  - ./docker/reanchoring-prover.yml
  - ./docker/attacker-peer-swarm.yml
  - ./docker/engram-node04-double-sign.yml

services:
  # ==========================================
  # CHAOS ENGINEERING PROFILES (PUMBA)
  # ==========================================
  
  pumba-latency:
    image: gaiaadm/pumba:latest
    container_name: pumba-latency-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket for container manipulation
    profiles:
      - chaos-delay
    # SCENARIO: Inject 100ms latency (±20ms jitter) for 5m to all engram-node containers
    command: 
      - "netem"
      - "--duration=5m"
      - "delay"
      - "--time=100"
      - "--jitter=20"
      - "re2:^engram-node.*"

  pumba-loss:
    image: gaiaadm/pumba:latest
    container_name: pumba-loss-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-loss
    # SCENARIO: Packet Loss - Drop 5% of network traffic on nodes 01 and 02 for 2m
    command: 
      - "netem"
      - "--duration=2m"
      - "loss"
      - "--percent=5"
      - "engram-node01"
      - "engram-node02"

  pumba-kill:
    image: gaiaadm/pumba:latest
    container_name: pumba-crash-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-crash
    # SCENARIO: Crash Fault - Forcefully terminate node 04 immediately
    command: 
      - "kill"
      - "--signal=SIGKILL"
      - "engram-node04"

  pumba-eclipse:
    image: gaiaadm/pumba:latest
    container_name: pumba-eclipse-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-eclipse
    # SCENARIO: Eclipse Attack - Isolate node 01 by dropping 100% of its traffic for 3m
    command:
      - "netem"
      - "--duration=3m"
      - "loss"
      - "--percent=100"
      - "engram-node01"

  pumba-btc-delay:
    image: gaiaadm/pumba:latest
    container_name: pumba-btc-delay-injector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-btc-delay
    # BTC congestion (docs/EXPERIMENT.md's E2 S2): delay/jitter applied
    # directly to bitcoin-node01, the only RPC target every validator's
    # AnchorTracker/btcGapMetric points at (bitcoin-node02 is only
    # bitcoin-node01's regtest sync peer, never dialed by engramd). Duration
    # matched to scripts/e2_fault_injection's staged-ramp orchestration, not
    # a single fixed window.
    command:
      - "netem"
      - "--duration=2m"
      - "delay"
      - "--time=500"
      - "--jitter=100"
      - "bitcoin-node01"

  # --- WAN realism profiles (chaos-wan-latency/-loss) -------------------------
  # Unlike pumba-latency/-loss above (one uniform value for all/some nodes),
  # each of the 4 validators gets its OWN delay/jitter or loss%, simulating
  # distinct real regions. Illustrative magnitudes, real tc netem rules.
  #
  # A third profile (bandwidth cap via `pumba netem rate`, for "congestion")
  # was dropped: `tc qdisc add ... netem rate 5mbit` fails with exit code 2
  # on this Docker Desktop VM's kernel (no rate-limiting in its sch_netem
  # build). Would need a TBF/HTB qdisc instead; not attempted.
  pumba-wan-latency-01:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=15", "--jitter=3", "engram-node01"]

  pumba-wan-latency-02:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-02
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=70", "--jitter=15", "engram-node02"]

  pumba-wan-latency-03:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-03
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=140", "--jitter=25", "engram-node03"]

  pumba-wan-latency-04:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-latency-04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-latency
    command: ["netem", "--duration=10m", "delay", "--time=45", "--jitter=10", "engram-node04"]

  pumba-wan-loss-01:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-01
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=1", "engram-node01"]

  pumba-wan-loss-02:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-02
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=3", "engram-node02"]

  pumba-wan-loss-03:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-03
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=6", "engram-node03"]

  pumba-wan-loss-04:
    image: gaiaadm/pumba:latest
    container_name: pumba-wan-loss-04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - chaos-wan-loss
    command: ["netem", "--duration=10m", "loss", "--percent=2", "engram-node04"]

networks:
  # Main validator network: external clients (reanchoring-prover, attacker
  # swarm) reach validators here. NOT used for validator-to-validator P2P
  # gossip anymore -- cmd/engramd/main.go's testnetInitFiles dials
  # persistent_peers over the pairwise-link networks below instead, so real
  # SubnetDiversity (x/sovereignty/types/subnet.go's SubnetOf) reads each
  # peer from a genuinely distinct subnet.
  engram-net:
    name: engram-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-engram"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  # Pairwise validator-to-validator P2P links -- one dedicated /29 per pair
  # (6 for 4 validators' full mesh), each validator statically addressed so
  # cmd/engramd/main.go's pairwiseLinkPeerIP can dial a literal IP instead
  # of a hostname. Index/IP scheme is defined there; both sides must stay
  # in sync by construction.
  #
  # A validator's in-container interface index (eth0, eth1, ...) for a given
  # network is NOT stable or predictable across the 4 validators or across
  # redeploys -- confirmed by cross-referencing `docker network inspect`'s
  # per-network MacAddress against each container's /sys/class/net/ethN/address.
  # A pumba `netem --interface ethN` chaos profile can silently land on the
  # wrong network (e.g. engram-net instead of a pairwise link) with zero
  # error. To fault-inject P2P specifically, disconnect/reconnect a
  # validator-link-* network by NAME (`docker network disconnect`/`connect
  # --ip`) instead -- see scripts/e3_failure_matrix/live_p2p_lifecycle_test.py.
  validator-link-01-02:
    name: validator-link-01-02
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/29
          gateway: 172.40.0.1
  validator-link-01-03:
    name: validator-link-01-03
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.1.0/29
          gateway: 172.40.1.1
  validator-link-01-04:
    name: validator-link-01-04
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.2.0/29
          gateway: 172.40.2.1
  validator-link-02-03:
    name: validator-link-02-03
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.3.0/29
          gateway: 172.40.3.1
  validator-link-02-04:
    name: validator-link-02-04
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.4.0/29
          gateway: 172.40.4.1
  validator-link-03-04:
    name: validator-link-03-04
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.5.0/29
          gateway: 172.40.5.1

  # Bitcoin network: Isolated environment for the Bitcoin regtest RPC cluster
  bitcoin-net:
    name: bitcoin-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-bitcoin"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  # Celestia network: Isolated environment for Celestia DA layer
  celestia-net:
    name: celestia-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-celestia"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

  # attacker-subnet-a/b/c/d: 4 distinct bridge networks for E4/E8's A2
  # (Sybil via simulated multi-subnet swarm, docker/attacker-peer-swarm.yml).
  # Honest validators now arrive at each other over 6 separate /29 pairwise
  # links (see this file's validator-link-* networks), so these give an
  # attacker swarm its own genuine multi-subnet diversity to test the real
  # ingress filter (FilterPeerByAddr) against, on engram-net where A2's
  # dynamic peers connect in.
  attacker-subnet-a:
    name: attacker-subnet-a
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  attacker-subnet-b:
    name: attacker-subnet-b
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
  attacker-subnet-c:
    name: attacker-subnet-c
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24
          gateway: 172.32.0.1
  attacker-subnet-d:
    name: attacker-subnet-d
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
          gateway: 172.33.0.1