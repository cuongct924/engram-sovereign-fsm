# Bring-your-own-hosts inventory: any 8 or 9 Linux machines reachable over SSH (any cloud, bare metal,
# CloudLab). Copy to inventory/hosts.yml and edit. Terraform users get this file generated by
# deploy/bin/make-inventory.py instead.
#
# ansible_host is the address the OTHER machines use to reach this one (its public IP, or a
# routable private IP if all hosts share a VPN/VPC). node_index is 1..N, unique, and fixes the
# validator order in genesis.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    infra:
      hosts:
        infra01:
          ansible_host: 203.0.113.10
    # Optional: a dedicated prover host (>= 16 GB RAM). Without it the prover runs on the infra host.
    prover:
      hosts:
        prover01:
          ansible_host: 203.0.113.18
    # Optional: proving workers (>= 16 GB RAM each). With them the prover host only prepares and submits proofs and each worker proves one at a time.
    prover_workers:
      hosts:
        prover-worker01:
          ansible_host: 203.0.113.19
          private_ip: 10.0.0.19
    validators:
      hosts:
        engram-node01: {ansible_host: 203.0.113.11, node_index: 1}
        engram-node02: {ansible_host: 203.0.113.12, node_index: 2}
        engram-node03: {ansible_host: 203.0.113.13, node_index: 3}
        engram-node04: {ansible_host: 203.0.113.14, node_index: 4}
        engram-node05: {ansible_host: 203.0.113.15, node_index: 5}
        engram-node06: {ansible_host: 203.0.113.16, node_index: 6}
        engram-node07: {ansible_host: 203.0.113.17, node_index: 7}
