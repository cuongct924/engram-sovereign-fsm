---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - bitcoin_rpc_password | length > 0
      - docker_hub_user | length > 0
      - image_tag | length > 0
      - image_tag != 'latest'
      - operator_cidrs | length > 0
      - groups['infra'] | length == 1
      - groups['validators'] | length >= 4
      - groups['validators'] | map('extract', hostvars, 'node_index') | map('int') | sort == range(1, (groups['validators'] | length) + 1) | list
      - engram_mode in ['engram', 'hard-gated', 'soft', 'vanilla']
      - (not (prover_enabled | bool)) or engram_chain_id == 'engram-dev-1'
    fail_msg: >-
      Set BITCOIN_RPC_PASSWORD, DOCKERHUB_USER and ENGRAM_IMAGE_TAG (the commit tag the build script prints, never latest), set operator_cidrs, give the inventory exactly one infra host and
      >= 4 validators whose node_index values are 1..N with no gaps (see inventory/example.yml), and keep engram_chain_id engram-dev-1 while the prover is on (the circuit compiles that chain id in).
    quiet: true

- name: Create the generated directory
  ansible.builtin.file:
    path: "{{ generated_dir }}"
    state: directory
    mode: "0700"

- name: Build engramd for the controller (generates genesis)
  ansible.builtin.command:
    cmd: go build -o {{ generated_dir }}/engramd ./cmd/engramd
    chdir: "{{ engram_repo_dir }}"
  changed_when: false

- name: Generate one genesis and one home per validator
  ansible.builtin.command:
    cmd: >-
      {{ generated_dir }}/engramd testnet init-files
      --v {{ validator_count }}
      --chain-id {{ engram_chain_id }}
      --output-dir {{ generated_dir }}/testnet-data
      --peer-hosts {{ (groups['validators'] | map('extract', hostvars) | sort(attribute='node_index')
                       | map(attribute='peer_host') | list) | join(',') }}
    creates: "{{ generated_dir }}/testnet-data/engram-node01/config/genesis.json"
  environment: "{{ engram_params | default({}) | combine({'ENGRAM_PARAM_NOOP': ''}) }}"

# The prover host reaches its workers over SSH with a key made for this deployment only; the public half goes to the workers.
- name: Create the key the prover host uses to reach its workers
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -C engram-prover-workers -f {{ generated_dir }}/prover_ssh_key
    creates: "{{ generated_dir }}/prover_ssh_key"
  when: groups['prover_workers'] | default([]) | length > 0

# The hosts build nothing; the infra host only runs three helper scripts from the repository.
- name: Archive the helper scripts the infra host runs
  ansible.builtin.shell: |
    set -e
    tmp=$(mktemp -d)
    mkdir -p "$tmp/engram-sovereign-fsm/scripts"
    for f in testnet_fund_wallet.sh testnet_fund_celestia_bridge.sh bitcoin_miner_loop.sh; do
      cp "{{ engram_repo_dir }}/scripts/$f" "$tmp/engram-sovereign-fsm/scripts/$f"
    done
    tar -C "$tmp" -czf "{{ generated_dir }}/src.tgz" engram-sovereign-fsm
    rm -rf "$tmp"
  args:
    executable: /bin/bash
  changed_when: true
