name: Go Test CI

on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
  pull_request:

jobs:
  test:
    name: Run Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout CometBFT fork (go.mod's local replace directive)
        # go.mod replaces github.com/cometbft/cometbft with a relative path
        # (../engram-consensus-core) to a sibling checkout -- without this,
        # `go mod download`/`go vet`/`go test` all fail at module-resolution
        # time, since that path only exists on a machine that also has this
        # fork checked out next to the main repo. `path:` here resolves
        # relative to github.workspace, landing as a sibling of the main
        # repo's own checkout root, matching the replace directive exactly.
        uses: actions/checkout@v4
        with:
          repository: cuongct924/engram-consensus-core
          # Pinned to the exact commit the local sibling checkout is on when
          # this workflow step was added -- NOT `main`, which would make CI
          # depend on a moving target nobody deliberately chose for a given
          # run. Bump this in lockstep whenever the local fork checkout
          # (../engram-consensus-core, relative to this repo) advances.
          ref: c32bf90f17ec58916929203c9799b389f63a564d
          path: ../engram-consensus-core

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -coverprofile=coverage.txt ./...
