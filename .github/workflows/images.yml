name: images

# Builds the two images the cluster runs on a native linux/amd64 runner and pushes them to Docker Hub, tagged with the commit.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access to the two repositories).
# Run it from the Actions tab (workflow_dispatch) or push a tag named release-*.
on:
  workflow_dispatch:
  push:
    tags: ["release-*"]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test ./x/... ./app/... ./cmd/...
      - name: ZK assets match the lock
        run: scripts/verify_zk_assets.sh

  images:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: deploy/bin/build-push-images.sh | tee build.log
      - name: Record the image digests
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag="$(git rev-parse --short=12 HEAD)"
          {
            echo "### Images for commit \`$tag\`"
            for image in engram-node engram-reanchoring-prover; do
              echo "- \`$DOCKERHUB_USER/$image:$tag\` $(docker buildx imagetools inspect "$DOCKERHUB_USER/$image:$tag" --format '{{.Manifest.Digest}}')"
            done
            grep '^\[images\] record' build.log
          } >> "$GITHUB_STEP_SUMMARY"
