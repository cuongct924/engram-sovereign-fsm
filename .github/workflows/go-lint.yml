name: Go Lint CI

on:
  push:
    paths:
      - '**/*.go'
  pull_request:

jobs:
  lint:
    name: Run GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout CometBFT fork (go.mod's local replace directive)
        # See go-test.yml's identical step for the full explanation -- same
        # go.mod replace directive, same module-resolution failure without
        # this, golangci-lint included since it resolves the module graph too.
        uses: actions/checkout@v4
        with:
          repository: cuongct924/engram-consensus-core
          ref: c32bf90f17ec58916929203c9799b389f63a564d
          path: ../engram-consensus-core

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # golangci-lint-action manages its own cache

      - name: Run Linter
        # v6+ required: .golangci.yml uses the v2 config schema (`version: "2"`),
        # which golangci-lint-action@v3's bundled v1.x binary cannot parse.
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m