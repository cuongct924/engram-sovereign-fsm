name: Go Lint CI

on:
  push:
    paths:
      - '**/*.go'
  pull_request:

jobs:
  lint:
    name: Run GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout CometBFT fork (go.mod's local replace directive)
        # See go-test.yml's identical step for the full explanation -- same
        # go.mod replace directive, same module-resolution failure without
        # this (golangci-lint included, since it resolves the module graph
        # too). Plain `git clone` here, NOT actions/checkout with path: ../..
        # -- confirmed live that actions/checkout refuses to place a checkout
        # outside its initial working directory, a security sandbox it
        # enforces unconditionally, not something a path: override can bypass.
        run: |
          git clone --quiet https://github.com/cuongct924/engram-consensus-core.git ../engram-consensus-core
          git -C ../engram-consensus-core checkout --quiet c32bf90f17ec58916929203c9799b389f63a564d

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # golangci-lint-action manages its own cache

      - name: Run Linter
        # v6+ required: .golangci.yml uses the v2 config schema (`version: "2"`),
        # which golangci-lint-action@v3's bundled v1.x binary cannot parse.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          # v2.x releases aren't installable via `go install <pkg>@v2...` with
          # this package path; use the prebuilt binary installer instead.
          install-mode: binary
          args: --timeout=5m
