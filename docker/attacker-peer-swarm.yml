name: engram-attacker-swarm

# Live docker Sybil/slot-exhaustion attacker swarm for E4/E8's A1 (Peer Slot
# Exhaustion) and A2 (Sybil via simulated multi-subnet swarm) -- verifies
# Part 1a's real ingress filter (x/sovereignty/keeper/peer_filter.go's
# FilterPeerByAddr, Params.MaxPeersPerSubnet) against real attacker traffic,
# not just synthetic Monte Carlo simulation.
#
# Every attacker* service here is a real `engramd` full-node process -- same
# image/Dockerfile as the 4 real validators (docker/engram-validator-node0N.yml),
# same real CometBFT P2P handshake -- but deliberately NOT part of the genesis
# validator set (no stake, never asked to sign or propose), pure P2P
# participants whose only job is to dial the target validator(s) aggressively.
# Real BTC/DA sensor env vars are deliberately omitted: wireBTCSensor/
# wireDASensor (cmd/engramd/main.go) both no-op cleanly when their env vars
# are unset, which is exactly what a pure-P2P attacker needs (it still
# participates in ProcessProposal for consensus bookkeeping, using the
# static sensor mock, but never claims a real anchor/DA state).
#
# Profile-gated (attacker-swarm-a1 / attacker-swarm-a2) so neither leg runs
# with a plain `docker compose up` -- must be explicitly requested via
# `docker compose --profile attacker-swarm-a1 up` (or -a2).
#
# Requires: the real 4-node cluster's shared genesis already generated at
# ../testnet-data/engram-node01/config/genesis.json (via `engramd testnet
# init-files --v 4`, this repo's existing bootstrap step) -- bind-mounted
# read-only into each attacker so its CometBFT handshake's chain-id/network
# matches the real cluster (a mismatched genesis would fail the handshake
# immediately and the attacker could never even attempt a connection, making
# this whole experiment a no-op).

x-attacker-common: &attacker-common
  build:
    context: ..
    dockerfile: Dockerfile
    additional_contexts:
      - cometbft-fork=../../engram-consensus-core
  restart: "no"
  # entrypoint: run `engramd init` first (idempotent -- generates a fresh
  # node_key.json/priv_validator_key.json only if this attacker's own volume
  # doesn't already have one; SKIPS genesis generation entirely because the
  # real shared genesis is already bind-mounted at the path init checks
  # before generating its own, per initHome's `if _, err := os.Stat(genesisFile)`
  # early-return), then attempt to connect to the target and start.
  entrypoint: ["/bin/sh", "-c"]

services:
  # ===========================================================
  # A1 leg -- Peer Slot Exhaustion: all attackers on engram-net,
  # dialing engram-node01 directly, exceeding MaxPeersPerSubnet
  # (Params default 8) well before CometBFT's own MaxNumInboundPeers
  # (default 40) would ever trip -- this leg's real point is showing
  # Part 1a's filter as the BINDING constraint, not the CometBFT-level cap.
  # ===========================================================
  attacker-a1-01: &attacker-a1
    <<: *attacker-common
    hostname: attacker-a1-01
    container_name: attacker-a1-01
    profiles: [attacker-swarm-a1]
    networks:
      engram-net:
        ipv4_address: 172.28.0.201
    volumes:
      - ../testnet-data/attacker-a1-01:/root/.engramd
      - ../testnet-data/engram-node01/config/genesis.json:/root/.engramd/config/genesis.json:ro
    environment:
      - TARGET_PEER=engram-node01:26656
    command:
      - |
        engramd init attacker-a1-01 --home /root/.engramd || true
        NODE_ID=$$(engramd tendermint show-node-id --home /root/.engramd 2>/dev/null || true)
        echo "attacker-a1-01 node_id=$$NODE_ID dialing $$TARGET_PEER"
        sed -i "s#^persistent_peers *=.*#persistent_peers = \"$$TARGET_PEER\"#" /root/.engramd/config/config.toml
        sed -i "s#^addr_book_strict *=.*#addr_book_strict = false#" /root/.engramd/config/config.toml
        sed -i "s#^allow_duplicate_ip *=.*#allow_duplicate_ip = true#" /root/.engramd/config/config.toml
        exec engramd start --home /root/.engramd

  attacker-a1-02:
    <<: *attacker-a1
    hostname: attacker-a1-02
    container_name: attacker-a1-02
