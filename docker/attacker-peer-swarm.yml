name: engram-attacker-swarm

# Live Sybil/slot-exhaustion attacker swarm for E4/E8's A1 (Peer Slot
# Exhaustion) and A2 (Sybil via simulated multi-subnet swarm) -- verifies
# the real ingress filter (x/sovereignty/keeper/peer_filter.go's
# FilterPeerByAddr, Params.MaxPeersPerSubnet) against real attacker
# traffic, not just synthetic Monte Carlo simulation.
#
# Every attacker* service is a real `engramd` full-node process -- same
# image as the 4 real validators, same real CometBFT P2P handshake -- but
# not part of the genesis validator set (no stake, never signs/proposes),
# pure P2P participants that dial the target validator(s) aggressively.
# BTC/DA sensor env vars are deliberately omitted: wireBTCSensor/
# wireDASensor no-op cleanly when unset, exactly what a pure-P2P attacker
# needs.
#
# Profile-gated (attacker-swarm-a1 / attacker-swarm-a2) so neither leg runs
# with a plain `docker compose up` -- must be requested explicitly via
# `docker compose --profile attacker-swarm-a1 up` (or -a2).
#
# Requires the real 4-node cluster's shared genesis already generated at
# ../testnet-data/engram-node01/config/genesis.json (`engramd testnet
# init-files --v 4`) -- bind-mounted read-only into each attacker so its
# CometBFT handshake matches the real cluster's chain-id/network.

x-attacker-common: &attacker-common
  build:
    context: ..
    dockerfile: Dockerfile
    additional_contexts:
      - cometbft-fork=../../engram-consensus-core
  restart: "no"
  # entrypoint: run `engramd init` first (idempotent -- only generates keys
  # if this attacker's volume doesn't already have them; skips genesis
  # generation since the real shared genesis is already bind-mounted),
  # then dial the target and start.
  entrypoint: ["/bin/sh", "-c"]

services:
  # ===========================================================
  # A1 leg -- Peer Slot Exhaustion: all attackers on engram-net, dialing
  # engram-node01 directly, exceeding MaxPeersPerSubnet (default 8) well
  # before CometBFT's own MaxNumInboundPeers (default 40) would trip --
  # shows the ingress filter as the binding constraint, not CometBFT's cap.
  # ===========================================================
  attacker-a1-01: &attacker-a1
    <<: *attacker-common
    hostname: attacker-a1-01
    container_name: attacker-a1-01
    profiles: [attacker-swarm-a1]
    networks:
      engram-net:
        ipv4_address: 172.28.0.201
    volumes:
      - ../testnet-data/attacker-a1-01:/root/.engramd
      - ../testnet-data/engram-node01/config/genesis.json:/root/.engramd/config/genesis.json:ro
    environment:
      - TARGET_PEER=engram-node01:26656
    command:
      - |
        engramd init attacker-a1-01 --home /root/.engramd || true
        NODE_ID=$$(engramd tendermint show-node-id --home /root/.engramd 2>/dev/null || true)
        echo "attacker-a1-01 node_id=$$NODE_ID dialing $$TARGET_PEER"
        TARGET_ID=$$(curl -s "http://$${TARGET_PEER%%:*}:26657/status" | jq -r .result.node_info.id)
        sed -i "s#^persistent_peers *=.*#persistent_peers = \"$${TARGET_ID}@$$TARGET_PEER\"#" /root/.engramd/config/config.toml
        sed -i "s#^addr_book_strict *=.*#addr_book_strict = false#" /root/.engramd/config/config.toml
        sed -i "s#^allow_duplicate_ip *=.*#allow_duplicate_ip = true#" /root/.engramd/config/config.toml
        exec engramd start --home /root/.engramd

  attacker-a1-02:
    <<: *attacker-a1
    hostname: attacker-a1-02
    container_name: attacker-a1-02
