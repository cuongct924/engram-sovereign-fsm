# E8 Timeout-flooding override: node04 keeps signing but floods genuinely
# signed Timeout messages instead of waiting for its precommit timer (fork's
# consensus/state.go timeoutFloodRoutine, gated by
# ENGRAM_TIMEOUT_FLOOD_INTERVAL_MS). Applied on demand:
#
#   docker compose -f compose.yml -f docker/engram-node04-timeout-flood.yml \
#     up -d --no-deps engram-node04
#
# Not in `include:` and no `name:` (see the byzantine file); node04 stays in
# the real N=4,f=1 set.

services:
  engram-node04:
    environment:
      - ENGRAM_TIMEOUT_FLOOD_INTERVAL_MS=${ENGRAM_TIMEOUT_FLOOD_INTERVAL_MS:-50}
