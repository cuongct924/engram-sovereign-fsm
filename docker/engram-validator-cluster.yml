      - "1517:1317"
      - "26860:26660"
    environment:
      <<: *engram-node-env
      MONIKER: engram-node03
      NODE_ID: 2
      CELESTIA_BRIDGE_URL: http://celestia-bridge-node03:26658
      CELESTIA_BRIDGE_AUTH_TOKEN: ${CELESTIA_BRIDGE_NODE03_AUTH_TOKEN}

  engram-node04:
    <<: *engram-node-base
    hostname: engram-node04
    container_name: engram-node04
    networks:
      engram-net:
        ipv4_address: 172.28.0.130
      bitcoin-net:
        ipv4_address: 172.21.0.130
      celestia-net:
        ipv4_address: 172.22.0.130
      validator-link-01-04:
        ipv4_address: 172.40.2.3
      validator-link-02-04:
        ipv4_address: 172.40.7.3
      validator-link-03-04:
        ipv4_address: 172.40.11.3
      validator-link-04-05:
