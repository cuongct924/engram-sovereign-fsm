  # node05-07: the "seven-node" profile (opt-in, not started by a bare
  # `docker compose up`) -- node01-04 alone form a complete, always-on
  # 4-validator testnet; pass `--profile seven-node` (or `make testnet-up
  # N=7`) to also bring these three up. Genesis validator count
  # (`testnet init-files --v N`) must match whichever set is actually
  # started, or the missing validators' voting power is simply absent.
  engram-node05:
    <<: *engram-node-base
    hostname: engram-node05
    container_name: engram-node05
    profiles: [seven-node]
    networks:
      engram-net:
        ipv4_address: 172.28.0.140
      bitcoin-net:
        ipv4_address: 172.21.0.140
      celestia-net:
        ipv4_address: 172.22.0.140
      validator-link-01-05:
        ipv4_address: 172.40.3.3
      validator-link-02-05:
        ipv4_address: 172.40.8.3
      validator-link-03-05:
        ipv4_address: 172.40.12.3
      validator-link-04-05:
        ipv4_address: 172.40.15.3
      validator-link-05-06:
        ipv4_address: 172.40.18.2
      validator-link-05-07:
        ipv4_address: 172.40.19.2
    volumes:
