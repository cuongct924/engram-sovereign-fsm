      - "1917:1317"
      - "27260:26660"
    environment:
      <<: *engram-node-env
      MONIKER: engram-node07
      NODE_ID: 6
      CELESTIA_BRIDGE_URL: http://celestia-bridge-node07:26658
      CELESTIA_BRIDGE_AUTH_TOKEN: ${CELESTIA_BRIDGE_NODE07_AUTH_TOKEN}

  # Non-validator observer for E2's "Vanilla comparison": `start --vanilla`
  # (NewEngramApp skips the ABCI++ hooks), syncing the SAME real chain and
  # reading the same BTC/DA sensors -- but its FSMState can never leave
  # genesis ANCHORED since CommitFSMTransition is never wired. Not part of
  # the validator set (genesis unchanged); a pure observer.
  engram-node-vanilla:
    <<: *engram-node-base
    hostname: engram-node-vanilla
    container_name: engram-node-vanilla
    command: ["start", "--vanilla"]
    networks:
      engram-net:
        ipv4_address: 172.28.0.170
      bitcoin-net:
        ipv4_address: 172.21.0.170
      celestia-net:
        ipv4_address: 172.22.0.170
    volumes:
      - ../testnet-data/engram-node-vanilla:/root/.engramd
    ports:
      - "27357:26657"
      - "2017:1317"
      - "27360:26660"
    environment:
      <<: *engram-node-env
      MONIKER: engram-node-vanilla
      NODE_ID: 7
      # --vanilla never wires ABCI++ hooks, so RefreshMetrics/MaybePublish
      # never run here -- reusing celestia-bridge-node01 (node01's) is inert, just
      # keeps parity with the other nodes having a real (if unused) DA source.
      CELESTIA_BRIDGE_URL: http://celestia-bridge-node01:26658
      CELESTIA_BRIDGE_AUTH_TOKEN: ${CELESTIA_BRIDGE_NODE01_AUTH_TOKEN}
