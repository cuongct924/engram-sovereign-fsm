      celestia-net:
        ipv4_address: 172.22.0.160
      validator-link-01-07:
        ipv4_address: 172.40.5.3
      validator-link-02-07:
        ipv4_address: 172.40.10.3
      validator-link-03-07:
        ipv4_address: 172.40.14.3
      validator-link-04-07:
        ipv4_address: 172.40.17.3
      validator-link-05-07:
        ipv4_address: 172.40.19.3
      validator-link-06-07:
