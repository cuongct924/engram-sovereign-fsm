name: engram-validator-cluster

# Shared shape for all 7 validators -- per-node differences only
# (hostname/container_name, IPs, ports, volume, MONIKER, NODE_ID); the
# rest lives here via the `<<: *engram-node-base` merge key.
x-engram-node-base: &engram-node-base
  build:
    context: ..
    dockerfile: Dockerfile
    additional_contexts:
      - cometbft-fork=../../engram-consensus-core
  command: ["start"]
  restart: unless-stopped
  # No depends_on celestia-lightNN: x/da talks to each validator's own
  # celestia-bridge-node01* directly, never a per-node light client (that
  # scaffolding was removed as unused).
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  # CPU weight under contention: validators > celestia-app/bitcoind > bridges > prover.
  cpu_shares: 2048
  logging:
    driver: json-file
    options:
      max-size: "1g"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '${ENGRAM_NODE_CPU_LIMIT:-1.0}'
        memory: ${ENGRAM_NODE_MEM_LIMIT:-1G}
      reservations:
        cpus: '0.2'
        memory: 384M

# Shared env wiring the live BTC/DA sensors: all 7 validators point at the
# same bitcoin-node01 (2 bitcoind for 7 validators -- prototype
# simplification). CELESTIA_BRIDGE_URL/CELESTIA_BRIDGE_AUTH_TOKEN are
# deliberately NOT here -- each validator below points at its OWN
# independent celestia-bridge-node01* instance (docker/celestia-local-cluster.yml),
# so DA availability is 7 separately-retrieved observations, not one shared
# bridge's view. MONIKER/NODE_ID are also per-node, set in each service
# below.
x-engram-node-env: &engram-node-env
  MINIMUM_GAS_PRICES: 0uengram
  BITCOIN_HOST: bitcoin-node01
  BITCOIN_RPC_PORT: 18443
  BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-engram_admin}
  BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:-secure_password_123}
  CELESTIA_NAMESPACE_ID: engramda01
  # E2's S2 fault-injection phase toggles this by touching/removing this path
  # inside each container -- see AnchorTracker.SetSubmissionPausedFile's doc.
  ANCHOR_SUBMISSION_PAUSED_FILE: /tmp/anchor_submission_paused
  # RQ2 comparison system: engram (default), hard-gated or soft -- see
  # cmd/engramd's resolveBaselineMode. Set via `make testnet-up MODE=...`.
  ENGRAM_MODE: ${ENGRAM_MODE:-engram}
  # DA RPC time limits (x/da); experiment settings, defaults unchanged.
  ENGRAM_DA_RPC_TIMEOUT_S: ${ENGRAM_DA_RPC_TIMEOUT_S:-20}
  ENGRAM_DA_CHECK_TIMEOUT_MS: ${ENGRAM_DA_CHECK_TIMEOUT_MS:-800}

# Networks are declared once in the root compose.yml, which owns them --
# redeclaring them here (even `external: true`) hits "conflicts with
# imported resource". bitcoin-net/celestia-net joins exist so
# BITCOIN_HOST/CELESTIA_BRIDGE_URL are DNS-resolvable (bitcoind/celestia
# services live on their own networks, unreachable from engram-net
# otherwise); validator-link-* joins are the real P2P mesh
# (cmd/engramd/main.go's pairwiseLinkPeerIP).

services:
  engram-node01:
    <<: *engram-node-base
    hostname: engram-node01
    container_name: engram-node01
    networks:
      engram-net:
        ipv4_address: 172.28.0.100
      bitcoin-net:
        ipv4_address: 172.21.0.100
      celestia-net:
        ipv4_address: 172.22.0.100
      validator-link-01-02:
        ipv4_address: 172.40.0.2
      validator-link-01-03:
        ipv4_address: 172.40.1.2
      validator-link-01-04:
        ipv4_address: 172.40.2.2
      validator-link-01-05:
        ipv4_address: 172.40.3.2
      validator-link-01-06:
        ipv4_address: 172.40.4.2
      validator-link-01-07:
        ipv4_address: 172.40.5.2
    volumes:
      - ../testnet-data/engram-node01:/root/.engramd
    ports:
      - "26657:26657"
      - "1317:1317"
      - "26660:26660"
    environment:
      <<: *engram-node-env
      MONIKER: engram-node01
      NODE_ID: 0
      CELESTIA_BRIDGE_URL: http://celestia-bridge-node01:26658
      CELESTIA_BRIDGE_AUTH_TOKEN: ${CELESTIA_BRIDGE_NODE01_AUTH_TOKEN}

  engram-node02:
