# E8 Double-signing harness: a SECOND, independent `engramd` holding node04's
# exact priv_validator_key.json, so the evidence pool sees real
# DuplicateVoteEvidence once both vote a height/round differently (see
# recordDetectedEvidence). Runs via the double-sign-harness profile, not
# `include:` (no `name:` -- see the byzantine file).
#
# Own FRESH priv_validator_state.json, NOT node04's -- FilePV's state file is
# the anti-double-sign guard; sharing it would make the double sign
# structurally impossible. Test-only, never a real network.

services:
  engram-node04-double-sign:
    build:
      context: ..
      dockerfile: Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    hostname: engram-node04-double-sign
    container_name: engram-node04-double-sign
    profiles: [double-sign-harness]
    networks:
      engram-net:
        ipv4_address: 172.28.0.220
    volumes:
      # Own separate home (sharing priv_validator_state.json would prevent the
      # double-sign). key/genesis aren't nested bind mounts (virtiofs can't
      # mount a file in a mounted dir); the e8 script copies them in before `up`.
      - ../testnet-data/engram-node04-double-sign:/root/.engramd
    environment:
      # :- (default), not :? (required) -- a required var would fail
      # interpolation for the WHOLE merged config; this placeholder fails
      # fast in-container if the e8 script forgot to set it.
      - PERSISTENT_PEERS=${DUPLICATE_PERSISTENT_PEERS:-SET_DUPLICATE_PERSISTENT_PEERS_BEFORE_USE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        engramd init engram-node04-double-sign --home /root/.engramd || true
        sed -i "s#^persistent_peers *=.*#persistent_peers = \"$$PERSISTENT_PEERS\"#" /root/.engramd/config/config.toml
        sed -i "s#^addr_book_strict *=.*#addr_book_strict = false#" /root/.engramd/config/config.toml
        sed -i "s#^allow_duplicate_ip *=.*#allow_duplicate_ip = true#" /root/.engramd/config/config.toml
        echo "engram-node04-double-sign: holding node04's real validator key, own independent state -- expect real DuplicateVoteEvidence once it votes"
        exec engramd start --home /root/.engramd
    restart: "no"

# engram-net is owned by the root compose.yml -- redeclaring it here would
# hit "conflicts with imported resource".
