name: engram-validator-node03

services:
  engram-node03:
    build: 
      context: ..
      dockerfile: Dockerfile
    hostname: engram-node03
    container_name: engram-node03
    networks:
      engram-net:
        ipv4_address: 172.28.0.120
    volumes:
      - ../testnet-data/engram-node03:/root/.engramd
    ports:
      # Offset ports by 200 to avoid conflicts
      - "26857:26657"   # Tendermint RPC (exposed)
      - "1517:1317"     # Cosmos REST API (exposed)
      - "26860:26660"   # Prometheus Metrics (exposed)
    environment:
      - DA_ENDPOINT=http://celestia-light03:26658
      - MINIMUM_GAS_PRICES=0uengram
      - MONIKER=engram-node03
      - NODE_ID=2
    command: ["start"]
    restart: unless-stopped
    depends_on:
      celestia-light03:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M

  # ==================== CELESTIA LIGHT NODE ====================
  celestia-light03:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-light03
    hostname: celestia-light03
    networks:
      engram-net:
        ipv4_address: 172.28.0.124
      celestia-net:
        ipv4_address: 172.22.0.102
    volumes:
      - celestia-light03-data:/home/celestia
    ports:
      - "26759:26658"   # RPC (exposed, offset by 200)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "http://127.0.0.1:26658/header/1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=light
      - P2P_NETWORK=private
      - NODE_ID=2
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    command: >
      sh -c "
      if [ ! -d /home/celestia/.light ]; then
        celestia light init --p2p.network private --ip 0.0.0.0
      fi
      celestia light start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658
      "

# engram-net/bitcoin-net/celestia-net are declared once in the root
# compose.yml, which owns them; services above reference them by name
# directly. Redeclaring them here (even as `external: true`) makes
# `docker compose config` fail with "conflicts with imported resource"
# once this file is resolved via compose.yml's `include:` (see M6).

volumes:
  celestia-light03-data:
    name: celestia-light03-data
    driver: local