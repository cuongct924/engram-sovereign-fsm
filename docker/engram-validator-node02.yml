name: engram-validator-node02

services:
  engram-node02:
    build: 
      context: ..
      dockerfile: Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    hostname: engram-node02
    container_name: engram-node02
    networks:
      engram-net:
        ipv4_address: 172.28.0.110
      # bitcoin-net: needed so BITCOIN_HOST=bitcoin-node01 (live BTC sensor
      # wiring, x/vigilante/rpc.go) is DNS-resolvable -- without this join,
      # every PrepareProposal fails to reach bitcoin-node01 and consensus
      # round-skips forever at height 1.
      bitcoin-net:
        ipv4_address: 172.21.0.110
      # celestia-net: needed so CELESTIA_BRIDGE_URL is DNS-resolvable (live
      # DA sensor wiring, x/da/rpc.go's wireDASensor) -- same reason as
      # bitcoin-net above.
      celestia-net:
        ipv4_address: 172.22.0.110
    volumes:
      - ../testnet-data/engram-node02:/root/.engramd
    ports:
      # Offset ports by 100 to avoid conflicts
      - "26757:26657"   # Tendermint RPC (exposed)
      - "1417:1317"     # Cosmos REST API (exposed)
      - "26760:26660"   # Prometheus Metrics (exposed)
    environment:
      - MINIMUM_GAS_PRICES=0uengram
      - MONIKER=engram-node02
      - NODE_ID=1
      # Live BTC sensor wiring (wireBTCSensor) -- all 4 validators point at
      # the same bitcoin-node01 (only 2 bitcoind instances are provisioned
      # for 4 validators, a documented prototype simplification), reached
      # via its Docker-network service name/internal port.
      - BITCOIN_HOST=bitcoin-node01
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-engram_admin}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD:-secure_password_123}
      # Live DA sensor wiring (wireDASensor) -- celestia-bridge is reached
      # via its Docker-network service name/internal port.
      # CELESTIA_BRIDGE_AUTH_TOKEN is the bridge's own admin/write JWT
      # (written to /home/celestia/bridge_auth.txt on first init) -- pinned
      # here since all 4 validators share one bridge instance.
      - CELESTIA_BRIDGE_URL=http://celestia-bridge:26658
      - CELESTIA_NAMESPACE_ID=engramda01
      - CELESTIA_BRIDGE_AUTH_TOKEN=${CELESTIA_BRIDGE_AUTH_TOKEN}
    command: ["start"]
    restart: unless-stopped
    # No depends_on celestia-light02 (deliberately removed): x/da's
    # Publisher/RPCClient talk to celestia-bridge directly, never to
    # celestia-lightNN -- unused scaffolding that would otherwise block
    # startup on a dependency this binary doesn't have.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M

# engram-net/bitcoin-net/celestia-net are declared once in the root
# compose.yml, which owns them -- redeclaring them here (even as
# `external: true`) makes `docker compose config` fail with "conflicts
# with imported resource" once resolved via compose.yml's `include:`.

# celestia-light02 (a Celestia DAS light-client service) previously lived
# here -- removed: never functional, and nothing in this repo's Go code
# used it (x/da talks to celestia-bridge directly). A real DAS
# light-client integration remains a documented future item if pursued.
