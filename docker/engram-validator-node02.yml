name: engram-validator-node02

services:
  engram-node02:
    build: 
      context: ..
      dockerfile: Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    hostname: engram-node02
    container_name: engram-node02
    networks:
      engram-net:
        ipv4_address: 172.28.0.110
    volumes:
      - ../testnet-data/engram-node02:/root/.engramd
    ports:
      # Offset ports by 100 to avoid conflicts
      - "26757:26657"   # Tendermint RPC (exposed)
      - "1417:1317"     # Cosmos REST API (exposed)
      - "26760:26660"   # Prometheus Metrics (exposed)
    environment:
      - MINIMUM_GAS_PRICES=0uengram
      - MONIKER=engram-node02
      - NODE_ID=1
      # Live BTC sensor wiring (x/vigilante/rpc.go, cmd/engramd/main.go's
      # wireBTCSensor) -- all 4 validators point at the same bitcoin-node01
      # (only 2 bitcoind instances are provisioned for 4 validators here, a
      # documented prototype simplification; a real deployment would give
      # each validator its own). Docker-network service name/internal port,
      # not the host-mapped 18443/19443 (a different network namespace from
      # inside this container).
      - BITCOIN_HOST=bitcoin-node01
      - BITCOIN_RPC_PORT=18443
      - BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-engram_admin}
      - BITCOIN_RPC_PASSWORD=${BITCOIN_RPC_PASSWORD:-secure_password_123}
    command: ["start"]
    restart: unless-stopped
    # No depends_on celestia-light02 here (deliberately removed): x/da's
    # Publisher/RPCClient talk to celestia-bridge directly (CELESTIA_BRIDGE_URL),
    # never to celestia-lightNN -- that service is unused scaffolding for a
    # future DAS light-client integration (see CLAUDE.md), and its "OLD,
    # unfixed buggy command pattern" leaves it permanently unhealthy today.
    # Gating engramd's startup on it blocked the entire 4-node testnet from
    # ever coming up for a dependency this binary doesn't actually have.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M

# engram-net/bitcoin-net/celestia-net are declared once in the root
# compose.yml, which owns them; services above reference them by name
# directly. Redeclaring them here (even as `external: true`) makes
# `docker compose config` fail with "conflicts with imported resource"
# once this file is resolved via compose.yml's `include:` (see M6).

# celestia-light02 (a Celestia DAS light-client service) previously lived
# here -- removed at the repo owner's request: it was never functional (its
# command pattern predates the celestia-app/bridge fixes, crash-looped on
# every start) and, more importantly, nothing in this repo's Go code ever
# used it -- x/da's Publisher/RPCClient talk to celestia-bridge directly
# (CELESTIA_BRIDGE_URL), and DA_ENDPOINT (which pointed here) was never
# read by any code either (see CLAUDE.md). A real DAS light-client
# integration remains a documented, not-yet-done future item if ever
# pursued -- this was pure non-functional scaffolding, not that feature.
