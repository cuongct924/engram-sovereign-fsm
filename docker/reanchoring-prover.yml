name: reanchoring-prover

# Containerized scripts/reanchoring_prover/watch_and_prove.sh -- previously
# had to be run manually on the host (needing nargo+bb installed locally),
# the real reason RECOVERING could never reach ANCHORED against a plain
# `docker compose up` cluster: zk_proof_ref stayed null in every proposal
# forever, not because of any hysteresis/timing bug, just because nothing
# was ever running the prover.
#
# Talks to engram-node01's RPC over engram-net (NODE_URL), same as any
# other client of the cluster -- not part of the validator set, doesn't
# need bitcoin-net/celestia-net.
services:
  reanchoring-prover:
    build:
      context: ..
      dockerfile: docker/reanchoring-prover/Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    container_name: reanchoring-prover
    hostname: reanchoring-prover
    networks:
      - engram-net
    environment:
      - NODE_URL=http://engram-node01:26657
      - POLL_INTERVAL_S=3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
