name: reanchoring-prover

# Containerized watch_and_prove.sh -- the ZK re-anchoring prover (not a
# validator, no bitcoin-net). Without it zk_proof_ref stays null and
# RECOVERING never reaches ANCHORED. Talks to node01's RPC over engram-net;
# also on celestia-net so the witness-publish step stores each proof's
# header witness on DA as an audit trail (RecoveryProofDAHeights).
services:
  reanchoring-prover:
    build:
      context: ..
      dockerfile: docker/reanchoring-prover/Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    container_name: reanchoring-prover
    hostname: reanchoring-prover
    networks:
      - engram-net
      - celestia-net
    environment:
      - NODE_URL=http://engram-node01:26657
      - POLL_INTERVAL_S=3
      # celestia-bridge-prover, NOT the validators' shared celestia-bridge-node01 --
      # see docker/celestia-local-cluster.yml's celestia-bridge-prover doc.
      - CELESTIA_BRIDGE_URL=http://celestia-bridge-prover:26658
      - CELESTIA_BRIDGE_AUTH_TOKEN=${CELESTIA_BRIDGE_PROVER_AUTH_TOKEN}
    restart: unless-stopped
    # tini (Docker's built-in --init) so SIGTERM reaches nargo/bb, not just
    # bash PID 1 -- without it, `docker stop`/`compose down` waits out the
    # full grace period then SIGKILLs mid-proof instead of exiting cleanly.
    init: true
    deploy:
      resources:
        limits:
      # cpus: bb prove (UltraHonk) spawns one worker thread per CPU; 6.0
      # leaves headroom for the validators + bitcoind + celestia.
      # memory: sized for witness-execution only (~2.2-2.4GB measured
      # live) now that circuit/README.md's circuits are compiled at
      # `docker build` time, not per proof cycle -- see the Dockerfile.
      # Docker Desktop's VM has 7.7GB total, not the host's 16GB.
          cpus: '6.0'
          memory: 4096M
