name: reanchoring-prover

# Containerized scripts/reanchoring_prover/watch_and_prove.sh -- without it
# running, zk_proof_ref stays null forever and RECOVERING can never reach
# ANCHORED. Talks to engram-node01's RPC over engram-net; not a validator,
# doesn't need bitcoin-net. Needs celestia-net too now: prove_and_submit.sh's
# publish-recovery-witness step publishes each proof's real header-chain
# witness to Celestia DA as an audit trail (HeaderHistory gets pruned once a
# proof is accepted) -- see x/sovereignty/keeper/msg_server.go's
# RecoveryProofDAHeights doc.
services:
  reanchoring-prover:
    build:
      context: ..
      dockerfile: docker/reanchoring-prover/Dockerfile
      additional_contexts:
        - cometbft-fork=../../engram-consensus-core
    container_name: reanchoring-prover
    hostname: reanchoring-prover
    networks:
      - engram-net
      - celestia-net
    environment:
      - NODE_URL=http://engram-node01:26657
      - POLL_INTERVAL_S=3
      # celestia-bridge-2, NOT the validators' shared celestia-bridge --
      # see docker/celestia-local-cluster.yml's celestia-bridge-2 doc.
      - CELESTIA_BRIDGE_URL=http://celestia-bridge-2:26658
      - CELESTIA_BRIDGE_AUTH_TOKEN=${CELESTIA_BRIDGE2_AUTH_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # bb prove (UltraHonk) spawns one worker thread per available CPU
          # ("Scheme is: ultra_honk, num threads: 8" in its own log line on
          # an 8-core host) -- capping this container at 1.0 CPU forced all
          # of bb's own 8 threads to contend for a single core, pure
          # scheduling overhead with none of the parallel speedup UltraHonk
          # proving is designed to get from multiple cores. Raised to 6.0
          # (leaving headroom for the 4 validators + bitcoind + celestia on
          # the same host) rather than removed entirely -- this is still a
          # cap, not a guarantee of 6 full cores.
          cpus: '6.0'
          memory: 2048M
