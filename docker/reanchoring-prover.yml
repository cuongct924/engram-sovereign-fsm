name: reanchoring-prover

# Containerized watch_and_prove.sh -- the ZK re-anchoring prover (not a
# validator, no bitcoin-net). Without it zk_proof_ref stays null and
# RECOVERING never reaches ANCHORED. Talks to node01's RPC over engram-net;
# also on celestia-net so the witness-publish step stores each proof's
# header witness on DA as an audit trail (RecoveryProofDAHeights).
services:
  reanchoring-prover:
    build:
      context: ..
      dockerfile: docker/reanchoring-prover/Dockerfile
    container_name: reanchoring-prover
    hostname: reanchoring-prover
    networks:
      - engram-net
      - celestia-net
    environment:
      - NODE_URL=http://engram-node01:26657
      - POLL_INTERVAL_S=3
      # Chunk-aggregation mode (prove_aggregate_and_submit.sh): off unless the caller exports ENGRAM_AGGREGATE=1.
      - ENGRAM_AGGREGATE=${ENGRAM_AGGREGATE:-0}
      - BATCH_THRESHOLD=${BATCH_THRESHOLD:-256}
      # Continuous mode (see watch_and_prove.sh): off unless the caller exports CONTINUOUS=1.
      - CONTINUOUS=${CONTINUOUS:-0}
      - MIN_BATCH=${MIN_BATCH:-1}
      # Pipelined prover (cmd/engramprover): off unless the caller exports PIPELINE=1.
      - PIPELINE=${PIPELINE:-0}
      - PROVERS=${PROVERS:-4}
      - STAGGER_S=${STAGGER_S:-27}
      - BB_THREADS=${BB_THREADS:-}
      - CELESTIA_BRIDGE_URL=http://celestia-bridge-prover:26658
      - CELESTIA_BRIDGE_AUTH_TOKEN=${CELESTIA_BRIDGE_PROVER_AUTH_TOKEN}
    restart: unless-stopped
    init: true
    # CPU weight under contention: validators > celestia-app/bitcoind > bridges > prover (256); PROVER_CPU_SHARES overrides it.
    cpu_shares: ${PROVER_CPU_SHARES:-256}
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Still OOM-kills live on a real (non-padded) N=256 proof even at
          # 8192M, with a 12GB Docker Desktop VM total -- bb's UltraHonk
          # proving spawns one thread per visible CPU (8 here) over a
          # ~6.7M-gate circuit, and per-thread FFT/MSM scratch buffers likely
          # push the real peak past what fits alongside the live validator+
          # bitcoind+celestia cluster on this machine's 16GB. Unresolved;
          # scripts/reanchoring_prover/watch_and_prove.sh run host-side
          # (unconstrained) is the reliable path until this is root-caused.
          cpus: '6.0'
          memory: 8192M
