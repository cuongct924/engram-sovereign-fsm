# Byzantine-mode override for E8's A3/A4/A6/A7. 
#
# Deliberately NOT in compose.yml's `include:` (would be always active) 
# and no top-level `name:` (would fork a project and fail to swap node04). 
# Applied on demand:
#
#   docker compose -f compose.yml -f docker/engram-node04-byzantine.yml \
#     up -d --no-deps engram-node04
#
# Only ENGRAM_BYZANTINE_BEHAVIOR is added -- node04 keeps its other env vars
# and stays in the real N=4,f=1 set. Valid values: applyByzantineBehavior
# (x/sovereignty/proposal.go), set at `up` time.

services:
  engram-node04:
    environment:
      - ENGRAM_BYZANTINE_BEHAVIOR=${ENGRAM_BYZANTINE_BEHAVIOR:?must be set, see applyByzantineBehavior's doc for valid values}
