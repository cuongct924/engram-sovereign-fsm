# Deliberately no top-level `name:` here -- Compose merges the LAST file's
# `name:` when given multiple `-f` flags, so declaring one here would fork
# this into a separate Compose project and fail to swap engram-node04
# ("container name already in use"). Omitting it lets this override
# inherit compose.yml's project name.
#
# Byzantine-mode override for docs/EXPERIMENT.md's E8 A3/A4/A6/A7 attack
# rows -- not in compose.yml's `include:` list (that would make byzantine
# mode always active). Applied explicitly on top of the normal cluster:
#
#   docker compose -f compose.yml -f docker/engram-node04-byzantine.yml \
#     up -d --no-deps engram-node04
#
# Compose merges `environment:` by key, so this only needs to declare
# ENGRAM_BYZANTINE_BEHAVIOR -- node04's other env vars are preserved.
# node04 stays in the real N=4,f=1 validator set the whole time (no 5th
# node added). scripts/e8_attack_resilience/live_byzantine_attacks.py swaps
# this override in per scenario, then reverts to the plain node04 definition.
#
# See applyByzantineBehavior (x/sovereignty/proposal.go) for recognized
# ENGRAM_BYZANTINE_BEHAVIOR values, set at `up` time via env substitution.

services:
  engram-node04:
    environment:
      - ENGRAM_BYZANTINE_BEHAVIOR=${ENGRAM_BYZANTINE_BEHAVIOR:?must be set, see applyByzantineBehavior's doc for valid values}
