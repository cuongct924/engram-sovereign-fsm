name: celestia-local-cluster

services:
  celestia-app:
    image: ghcr.io/celestiaorg/celestia-app:${CELESTIA_APP_VERSION:-v1.11.0}
    container_name: celestia-app
    hostname: celestia-app
    networks:
      celestia-net:
        ipv4_address: 172.22.0.50
    ports:
      - "26656:26656"
      - "26657:26657"
      - "9090:9090"
    # (No 26658 mapping here -- that's celestia-node's RPC port convention,
    # used by celestia-bridge below, not celestia-appd's. The original
    # mapping conflicted with celestia-bridge's own 26658:26658, found by
    # actually starting both: "Bind for 0.0.0.0:26658 failed: port is
    # already allocated".)
    environment:
      - CELESTIA_CHAIN_ID=private
    volumes:
      - ../data/celestia-app:/home/celestia
    restart: unless-stopped
    healthcheck:
      # curl isn't installed in this image (only wget) -- found by `docker
      # exec ... which curl` coming back empty. Also, the exec-form `CMD`
      # array below passed "url | grep ..." as one literal wget/curl
      # argument (no shell, so the pipe was never interpreted), which meant
      # this healthcheck failed unconditionally regardless of real node
      # health -- confirmed by `docker compose ps` reporting "unhealthy"
      # while the container's own logs showed it committing real blocks.
      # --spider avoids needing a shell/pipe at all: exit 0 iff the RPC
      # endpoint answers.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:26657/status"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    # Override the image's default ENTRYPOINT (/opt/entrypoint.sh) -- that
    # script does `exec /bin/celestia-appd "$@"` unconditionally on whatever
    # args it's given, with no shell interpretation, so passing it a
    # multi-statement `sh -c "if ...; then ...; fi; celestia-appd start"`
    # command (the previous version of this file) just gets forwarded as
    # `celestia-appd sh -c "..."`, which celestia-appd rejects as an unknown
    # subcommand (found by actually running `docker compose up`, not by
    # inspection). Running our own init-then-start script under a real shell
    # needs entrypoint replaced with one.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `init` (unlike `keys add`) has no --keyring-backend flag at all, and
      # its default --home is /home/celestia/.celestia-app (a subdir of this
      # service's mounted volume), not /home/celestia itself -- both found by
      # running `celestia-appd init --help` / a real init attempt, not
      # documentation. `start` separately requires a minimum gas price
      # (either app.toml or --minimum-gas-prices) or it refuses to boot;
      # "utia" is the real default bond/fee denom (confirmed from a real
      # `init`'s printed genesis, not "stake" as the denom name might
      # suggest). `init` alone also does NOT register any validator --
      # confirmed by a real `start` panicking with "validator set is empty
      # after InitGenesis" -- a plain Cosmos SDK chain needs the standard
      # manual bootstrap sequence (keys add, add-genesis-account, gentx,
      # collect-gentxs) that `engramd init` in this repo does automatically
      # but celestia-appd's `init` does not. Gate the init-vs-skip check on
      # genesis.json's gentx being collected (config/gentx/ removed by
      # collect-gentxs) rather than genesis.json's mere existence: an earlier
      # version of this script gated on genesis.json alone, which `init`
      # writes (empty validator set) before the gentx steps even run, so a
      # container that crashed mid-bootstrap would permanently skip retrying
      # on every subsequent restart.
      - |
        if [ ! -f /home/celestia/.celestia-app/config/genesis.json ] || [ -d /home/celestia/.celestia-app/config/gentx ]; then
          celestia-appd init mynode --chain-id private &&
          celestia-appd keys add validator --keyring-backend test >> /home/celestia/admin_seed.txt 2>&1 &&
          celestia-appd add-genesis-account validator 1000000000000utia --keyring-backend test &&
          celestia-appd gentx validator 5000000000utia --chain-id private --keyring-backend test &&
          celestia-appd collect-gentxs
        fi
        celestia-appd start --rpc.laddr tcp://0.0.0.0:26657 --minimum-gas-prices 0.001utia --grpc.enable --grpc.address 0.0.0.0:9090

  celestia-bridge:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge
    hostname: celestia-bridge
    networks:
      celestia-net:
        ipv4_address: 172.22.0.51
    ports:
      - "2121:2121"
      - "26658:26658"
    volumes:
      - ../data/celestia-bridge:/home/celestia
    restart: unless-stopped
    healthcheck:
      # Two real bugs found by actually querying this endpoint, not just
      # inspection: (1) same exec-form-with-shell-operator issue as
      # celestia-app's healthcheck (the dropped `|| exit 1` was never
      # interpreted); (2) celestia-node's RPC is JSON-RPC 2.0 over POST
      # only -- a plain GET to /header/1 returns HTTP 400 "Invalid request"
      # unconditionally, so `curl -sf` on a GET always failed regardless of
      # real node health. POSTing a real JSON-RPC call instead --
      # header.NetworkHead needs no params and works with --rpc.skip-auth
      # (added to bridge start above; this is a local devnet, not a
      # public-facing deployment, so skipping the JWT dance here is fine).
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    # Same entrypoint-override reasoning as celestia-app above: this image's
    # /opt/entrypoint.sh does have some auto-init logic (celestia <NODE_TYPE>
    # init when $1 == 'celestia'), but it doesn't generate the admin JWT
    # (`celestia bridge auth admin`) x/da's blob-submission client needs, so
    # a plain args-only command isn't enough here either -- keep the same
    # sh -c override for full control over both init and auth-token
    # generation.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `bridge init --help` says "--p2p.network ... Must be passed on both
      # init and start to take effect". With --p2p.network private, the
      # node store lands at /home/celestia/.celestia-bridge-private, NOT
      # /home/celestia/.bridge (the default-network path) -- confirmed by
      # `bridge init`'s own log line ("Initializing Bridge Node Store over
      # '.../.celestia-bridge-private'"); gating the skip-init check on the
      # wrong directory made init silently re-run on every restart.
      #
      # `--core.ip` on init only records Core.IP/RPCPort/GRPCPort into
      # config.toml -- it does NOT auto-populate [Header] TrustedHash (found
      # by inspecting the written config.toml directly: TrustedHash was ""
      # even with --core.ip set), and this celestia-node version has no CLI
      # flag for it either (`bridge init --help` / `bridge start --help`
      # both lack anything like --headers.trusted-hash, unlike some
      # celestia-node versions' docs). Without it, start panics with
      # "core/fetcher: block not found, hash: " (an empty hash). Fetching
      # block 1's real hash from celestia-app's RPC and patching it into
      # config.toml via sed is the same fix Celestia's own troubleshooting
      # docs describe for other versions, just done here since no flag
      # exists to pass it directly.
      # $$-escaped below (HOME_DIR/TRUSTED_HASH) so Docker Compose passes a
      # literal $VAR through to the container's shell instead of trying to
      # interpolate it itself from the HOST's environment first (a real
      # failure mode hit here: compose logged "The HOME_DIR variable is not
      # set. Defaulting to a blank string." and ran the script with both
      # substituted empty before the container's own shell ever saw them).
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth

 
# celestia-net is declared once in the root compose.yml, which owns it;
# services above reference it by name directly. Redeclaring it here (even as
# `external: true`) makes `docker compose config` fail with "conflicts with
# imported resource" once this file is resolved via compose.yml's `include:`
# (see M6).


volumes:
  celestia-validator-data:
    name: celestia-validator-data
  celestia-bridge-data:
    name: celestia-bridge-data