name: celestia-local-cluster

services:
  celestia-app:
    image: ghcr.io/celestiaorg/celestia-app:${CELESTIA_APP_VERSION:-v1.11.0}
    container_name: celestia-app
    hostname: celestia-app
    networks:
      celestia-net:
        ipv4_address: 172.22.0.50
    ports:
      # Host-mapped to 27656/27657 (not 26656/26657, which engram-node01
      # needs) -- container-internal ports unchanged.
      - "${CELESTIA_APP_P2P_PORT:-27656}:26656"
      - "${CELESTIA_APP_RPC_PORT:-27657}:26657"
      - "${CELESTIA_APP_GRPC_PORT:-9090}:9090"
    # No 26658 mapping here -- that's celestia-node's RPC port (used by
    # celestia-bridge-node01 below), not celestia-appd's.
    environment:
      - CELESTIA_CHAIN_ID=private
    volumes:
      - ../data/celestia-app:/home/celestia
    restart: unless-stopped
    healthcheck:
      # wget only (no curl in this image); --spider avoids shell/pipe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:26657/status"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 40s
    # CPU weight under contention: validators > celestia-app/bitcoind > bridges > prover.
    cpu_shares: 1024
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CELESTIA_APP_CPU_LIMIT:-1.0}'
          memory: ${CELESTIA_APP_MEM_LIMIT:-1536M}
        reservations:
          cpus: '0.2'
          memory: 512M
    # The image's default ENTRYPOINT is a bare non-shell exec -- the
    # multi-statement init-then-start script below needs a real shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `init` doesn't register a validator nor accept --keyring-backend --
      # keys/account/gentx/collect-gentxs are manual or `start` boots with
      # an empty validator set. Gated on gentx collected (not genesis.json,
      # which `init` writes first). Sets tx indexer "kv" for x/da's hash
      # lookups; `start` also needs an explicit --minimum-gas-prices.
      - |
        if [ ! -f /home/celestia/.celestia-app/config/genesis.json ] || [ -d /home/celestia/.celestia-app/config/gentx ]; then
          celestia-appd init mynode --chain-id private &&
          celestia-appd keys add validator --keyring-backend test >> /home/celestia/admin_seed.txt 2>&1 &&
          celestia-appd add-genesis-account validator 1000000000000utia --keyring-backend test &&
          celestia-appd gentx validator 5000000000utia --chain-id private --keyring-backend test &&
          celestia-appd collect-gentxs &&
          sed -i 's/indexer = "null"/indexer = "kv"/' /home/celestia/.celestia-app/config/config.toml
        fi
        celestia-appd start --rpc.laddr tcp://0.0.0.0:26657 --minimum-gas-prices 0.001utia --grpc.enable --grpc.address 0.0.0.0:9090

  celestia-bridge-node01:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge-node01
    hostname: celestia-bridge-node01
    networks:
      celestia-net:
        ipv4_address: 172.22.0.51
    ports:
      - "${CELESTIA_BRIDGE_P2P_PORT:-2121}:2121"
      - "${CELESTIA_BRIDGE_RPC_PORT:-26658}:26658"
    volumes:
      - ../data/celestia-bridge-node01:/home/celestia
    restart: unless-stopped
    healthcheck:
      # celestia-node's RPC is JSON-RPC 2.0 POST-only -- a plain GET always
      # returns 400. --rpc.skip-auth is fine on this local devnet.
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    # CPU weight under contention: validators > celestia-app/bitcoind > bridges > prover.
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CELESTIA_BRIDGE_CPU_LIMIT:-0.5}'
          memory: ${CELESTIA_BRIDGE_MEM_LIMIT:-1G}
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    # Same entrypoint override as celestia-app: auto-init doesn't generate
    # the admin JWT x/da's blob-submission client needs.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # With `--p2p.network private` the store lands in
      # .celestia-bridge-private -- gate skip-init on that dir. `init`
      # doesn't set [Header] TrustedHash (no CLI flag), which `start`
      # requires, so fetch block 1's hash from celestia-app and patch
      # config.toml. $$-escaped so Compose passes literal $VARs through.
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth

  # celestia-bridge-prover: a SECOND bridge against the same celestia-app chain
  # with its OWN account -- so reanchoring-prover's witness-publish has a
  # submitter separate from the validators' own bridges. Sharing one account
  # across submitters caused 3-4 sequence-mismatch races/sec (x/da's Submit
  # retry mitigates but doesn't eliminate it); only the signing ACCOUNT must
  # differ per contending submitter group.
  celestia-bridge-prover:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge-prover
    hostname: celestia-bridge-prover
    networks:
      celestia-net:
        ipv4_address: 172.22.0.52
    ports:
      - "${CELESTIA_BRIDGE2_P2P_PORT:-2122}:2121"
      - "${CELESTIA_BRIDGE2_RPC_PORT:-26668}:26658"
    volumes:
      - ../data/celestia-bridge-prover:/home/celestia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    # CPU weight under contention: validators > celestia-app/bitcoind > bridges > prover.
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${CELESTIA_BRIDGE_CPU_LIMIT:-0.5}'
          memory: ${CELESTIA_BRIDGE_MEM_LIMIT:-1G}
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth

  # One independent bridge per validator (not all sharing node01's) so DA
