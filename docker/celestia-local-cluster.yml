name: celestia-local-cluster

services:
  celestia-app:
    image: ghcr.io/celestiaorg/celestia-app:${CELESTIA_APP_VERSION:-v1.11.0}
    container_name: celestia-app
    hostname: celestia-app
    networks:
      celestia-net:
        ipv4_address: 172.22.0.50
    ports:
      # Host-side 27656/27657, not CometBFT's standard 26656/26657 (which
      # engram-node01 also needs on the host) -- container-internal ports
      # are unchanged, only the host mapping shifts.
      - "27656:26656"
      - "27657:26657"
      - "9090:9090"
    # No 26658 mapping here -- that's celestia-node's RPC port (used by
    # celestia-bridge below), not celestia-appd's.
    environment:
      - CELESTIA_CHAIN_ID=private
    volumes:
      - ../data/celestia-app:/home/celestia
    restart: unless-stopped
    healthcheck:
      # wget only (no curl in this image); --spider needs no shell/pipe,
      # unlike a piped "url | grep" test under exec-form CMD.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:26657/status"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    # Overrides the image's default ENTRYPOINT (a bare, non-shell
    # `exec /bin/celestia-appd "$@"`) -- the multi-statement
    # init-then-start script below needs a real shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # celestia-appd's `init` has no --keyring-backend flag (`keys add`
      # does) and doesn't register a validator on its own -- keys/genesis
      # account/gentx/collect-gentxs are required manually, or `start`
      # boots with an empty validator set. Gated on gentx being collected
      # (config/gentx/ removed by collect-gentxs), not genesis.json's
      # existence, since `init` writes genesis.json before gentx runs.
      # `start` also requires an explicit --minimum-gas-prices to boot.
      # Also patches config.toml's tx indexer to "kv" (default "null") --
      # x/da's blob-submission client needs it to look up txs by hash.
      - |
        if [ ! -f /home/celestia/.celestia-app/config/genesis.json ] || [ -d /home/celestia/.celestia-app/config/gentx ]; then
          celestia-appd init mynode --chain-id private &&
          celestia-appd keys add validator --keyring-backend test >> /home/celestia/admin_seed.txt 2>&1 &&
          celestia-appd add-genesis-account validator 1000000000000utia --keyring-backend test &&
          celestia-appd gentx validator 5000000000utia --chain-id private --keyring-backend test &&
          celestia-appd collect-gentxs &&
          sed -i 's/indexer = "null"/indexer = "kv"/' /home/celestia/.celestia-app/config/config.toml
        fi
        celestia-appd start --rpc.laddr tcp://0.0.0.0:26657 --minimum-gas-prices 0.001utia --grpc.enable --grpc.address 0.0.0.0:9090

  celestia-bridge:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge
    hostname: celestia-bridge
    networks:
      celestia-net:
        ipv4_address: 172.22.0.51
    ports:
      - "2121:2121"
      - "26658:26658"
    volumes:
      - ../data/celestia-bridge:/home/celestia
    restart: unless-stopped
    healthcheck:
      # celestia-node's RPC is JSON-RPC 2.0 over POST only -- a plain GET
      # always returns HTTP 400 regardless of real health. --rpc.skip-auth
      # below is fine here (local devnet, not public-facing).
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    # Same entrypoint-override reasoning as celestia-app above: this
    # image's auto-init doesn't generate the admin JWT x/da's
    # blob-submission client needs, so a plain args-only command isn't
    # enough here either.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # --p2p.network must be passed to both init and start; with `private`
      # the node store lands at /home/celestia/.celestia-bridge-private
      # (not the default path) -- gate the skip-init check on that
      # directory. --core.ip on init records Core.IP/RPCPort/GRPCPort but
      # not [Header] TrustedHash (no CLI flag for it in this version),
      # which start requires -- fetch block 1's real hash from
      # celestia-app's RPC and patch it into config.toml directly.
      #
      # $$-escaped (HOME_DIR/TRUSTED_HASH) so Compose passes a literal $VAR
      # through to the container's shell instead of interpolating it first.
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth

  # celestia-bridge-2: a SECOND bridge node against the SAME celestia-app
  # chain, with its OWN keyring/account -- exists only so
  # reanchoring-prover's witness-publish (docker/reanchoring-prover.yml) has
  # a submitter account separate from the 4 validators' shared celestia-bridge
  # above. Confirmed live: adding reanchoring-prover as a 5th concurrent
  # submitter on ONE shared account sustained 3-4 account-sequence-mismatch
  # races/sec, degrading real DA health for all 4 validators, not just the
  # new feature (x/da/rpc.go's Submit retry mitigates but doesn't eliminate
  # this under sustained contention). Multiple bridge/light nodes reading
  # AND writing to one Celestia chain is normal; only the signing ACCOUNT
  # needs to differ per contending submitter group.
  celestia-bridge-2:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge-2
    hostname: celestia-bridge-2
    networks:
      celestia-net:
        ipv4_address: 172.22.0.52
    ports:
      - "2122:2121"
      - "26668:26658"
    volumes:
      - ../data/celestia-bridge-2:/home/celestia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth


# celestia-net is declared once in the root compose.yml, which owns it;
# services above reference it by name directly. Redeclaring it here (even as
# `external: true`) makes `docker compose config` fail with "conflicts with
# imported resource" once this file is resolved via compose.yml's `include:`
# (see M6).


volumes:
  celestia-validator-data:
    name: celestia-validator-data
  celestia-bridge-data:
    name: celestia-bridge-data