name: celestia-local-cluster

services:
  celestia-app:
    image: ghcr.io/celestiaorg/celestia-app:${CELESTIA_APP_VERSION:-v1.11.0}
    container_name: celestia-app
    hostname: celestia-app
    networks:
      celestia-net:
        ipv4_address: 172.22.0.50
    ports:
      # Host-side 27656/27657, not 26656/26657: those are CometBFT's
      # standard P2P/RPC ports, which engram-node01 also needs on the host.
      # Container-internal ports stay 26656/26657 (celestia-app's own
      # convention) -- only the host mapping changes; nothing outside this
      # container reaches celestia-app via its host port.
      - "27656:26656"
      - "27657:26657"
      - "9090:9090"
    # (No 26658 mapping here -- that's celestia-node's RPC port convention,
    # used by celestia-bridge below, not celestia-appd's; it conflicts with
    # celestia-bridge's own 26658:26658.)
    environment:
      - CELESTIA_CHAIN_ID=private
    volumes:
      - ../data/celestia-app:/home/celestia
    restart: unless-stopped
    healthcheck:
      # curl isn't installed in this image (only wget). The exec-form CMD
      # array can't interpret a shell pipe, so a "url | grep ..." test
      # fails unconditionally regardless of real health -- --spider avoids
      # needing a shell/pipe at all: exit 0 iff the RPC endpoint answers.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:26657/status"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    # Override the image's default ENTRYPOINT (/opt/entrypoint.sh) -- it
    # does `exec /bin/celestia-appd "$@"` unconditionally with no shell
    # interpretation, so a multi-statement init-then-start script needs a
    # real shell entrypoint instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `init` has no --keyring-backend flag (that's `keys add`), and its
      # default --home is a subdir of this volume, not the volume root.
      # `start` needs an explicit minimum gas price or it refuses to boot;
      # "utia" is the real default bond/fee denom, not "stake". `init`
      # alone never registers a validator -- needs the standard manual
      # bootstrap (keys add, add-genesis-account, gentx, collect-gentxs)
      # `engramd init` does automatically but celestia-appd's `init` does
      # not, or `start` panics with "validator set is empty after
      # InitGenesis". Gated on gentx being collected (config/gentx/ removed
      # by collect-gentxs), not genesis.json's mere existence -- `init`
      # writes genesis.json (empty validator set) before the gentx steps
      # run, so gating on existence alone would permanently skip retrying
      # after a mid-bootstrap crash.
      #
      # `init` writes config.toml with [tx_index] indexer = "null" by
      # default, with no `start`-time flag to override it -- x/da's
      # blob-submission client needs tx indexing to look up submitted txs
      # by hash, so patch to "kv" right after init.
      - |
        if [ ! -f /home/celestia/.celestia-app/config/genesis.json ] || [ -d /home/celestia/.celestia-app/config/gentx ]; then
          celestia-appd init mynode --chain-id private &&
          celestia-appd keys add validator --keyring-backend test >> /home/celestia/admin_seed.txt 2>&1 &&
          celestia-appd add-genesis-account validator 1000000000000utia --keyring-backend test &&
          celestia-appd gentx validator 5000000000utia --chain-id private --keyring-backend test &&
          celestia-appd collect-gentxs &&
          sed -i 's/indexer = "null"/indexer = "kv"/' /home/celestia/.celestia-app/config/config.toml
        fi
        celestia-appd start --rpc.laddr tcp://0.0.0.0:26657 --minimum-gas-prices 0.001utia --grpc.enable --grpc.address 0.0.0.0:9090

  celestia-bridge:
    image: ghcr.io/celestiaorg/celestia-node:${CELESTIA_NODE_VERSION:-v0.14.1}
    container_name: celestia-bridge
    hostname: celestia-bridge
    networks:
      celestia-net:
        ipv4_address: 172.22.0.51
    ports:
      - "2121:2121"
      - "26658:26658"
    volumes:
      - ../data/celestia-bridge:/home/celestia
    restart: unless-stopped
    healthcheck:
      # celestia-node's RPC is JSON-RPC 2.0 over POST only -- a plain GET
      # always returns HTTP 400 regardless of real node health. POSTing a
      # real JSON-RPC call instead; header.NetworkHead needs no params and
      # works with --rpc.skip-auth (added to bridge start below -- a local
      # devnet, not public-facing, so skipping the JWT here is fine).
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"header.NetworkHead\",\"params\":[]}",
             "http://127.0.0.1:26658/"]
      interval: 60s
      timeout: 10s
      retries: 2
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    depends_on:
      celestia-app:
        condition: service_healthy
    environment:
      - NODE_TYPE=bridge
      - P2P_NETWORK=private
    # Same entrypoint-override reasoning as celestia-app above: this
    # image's auto-init logic doesn't generate the admin JWT (`celestia
    # bridge auth admin`) x/da's blob-submission client needs, so a plain
    # args-only command isn't enough here either.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `bridge init --help`: --p2p.network must be passed on both init and
      # start. With --p2p.network private, the node store lands at
      # /home/celestia/.celestia-bridge-private, not the default-network
      # path -- gate the skip-init check on that directory.
      #
      # --core.ip on init only records Core.IP/RPCPort/GRPCPort -- it does
      # NOT auto-populate [Header] TrustedHash, and this celestia-node
      # version has no CLI flag for it either. Without it, start panics
      # with "core/fetcher: block not found, hash: ". Fetching block 1's
      # real hash from celestia-app's RPC and patching it into config.toml
      # via sed is the same fix Celestia's own troubleshooting docs
      # describe for other versions.
      #
      # $$-escaped below (HOME_DIR/TRUSTED_HASH) so Compose passes a
      # literal $VAR through to the container's shell instead of
      # interpolating it from the host's environment first.
      - |
        HOME_DIR=/home/celestia/.celestia-bridge-private
        if [ ! -d "$$HOME_DIR" ]; then
          celestia bridge init --p2p.network private --core.ip celestia-app &&
          celestia bridge auth admin --p2p.network private > /home/celestia/bridge_auth.txt 2>&1 &&
          TRUSTED_HASH=$$(wget -q -O - http://celestia-app:26657/block?height=1 | jq -r '.result.block_id.hash') &&
          sed -i "s/TrustedHash = \"\"/TrustedHash = \"$$TRUSTED_HASH\"/" "$$HOME_DIR/config.toml"
        fi
        celestia bridge start --core.ip celestia-app --p2p.network private --rpc.addr 0.0.0.0 --rpc.port 26658 --rpc.skip-auth

 
# celestia-net is declared once in the root compose.yml, which owns it;
# services above reference it by name directly. Redeclaring it here (even as
# `external: true`) makes `docker compose config` fail with "conflicts with
# imported resource" once this file is resolved via compose.yml's `include:`
# (see M6).


volumes:
  celestia-validator-data:
    name: celestia-validator-data
  celestia-bridge-data:
    name: celestia-bridge-data