global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'engram-cluster'
    cluster: 'engram-bft'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Engram Node 1
  - job_name: 'engram-node01'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['engram-node01:26660']
        labels:
          instance: 'engram-node01'
          node_id: '1'
          validator: 'true'

  # Engram Node 2
  - job_name: 'engram-node02'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['engram-node02:26660']
        labels:
          instance: 'engram-node02'
          node_id: '2'
          validator: 'true'

  # Engram Node 3
  - job_name: 'engram-node03'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['engram-node03:26660']
        labels:
          instance: 'engram-node03'
          node_id: '3'
          validator: 'true'

  # Engram Node 4
  - job_name: 'engram-node04'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['engram-node04:26660']
        labels:
          instance: 'engram-node04'
          node_id: '4'
          validator: 'true'
