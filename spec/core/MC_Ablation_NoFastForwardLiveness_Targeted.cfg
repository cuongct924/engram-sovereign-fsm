\* Targeted variant of MC_Ablation_NoFastForwardLiveness.cfg -- same driver
\* (MC_Ablation_NoFastForwardLiveness.tla), tighter StateSpaceLimit bounds.
\*
\* Rationale (TLA+-expert fork investigation, see report to parent session):
\* UponfPlusOneTimeoutsAny(p) (EngramTendermint.tla:816) and
\* ServerHonestTimeout/ServerHonestRoundSkip (EngramServer.tla:333,374) cover
\* DISJOINT liveness scenarios -- the latter's guard requires
\* `Proposer[r] \in ByzantineNodes` with a stalled E_QC/no M_QC (silent
\* Byzantine leader), so it cannot substitute for f+1 fast-forward when an
\* HONEST round (proposer not Byzantine) simply fails to reach a 2f+1
\* precommit quorum before every honest node's local timer expires --
\* OnRoundCatchup (EngramTendermint.tla:797) also can't help, since it needs
\* f+1 nodes already substantively in the higher round via
\* propose/prevote/precommit, which by definition hasn't happened yet in
\* this stall. StartRound is called from exactly 4 sites in
\* EngramTendermint.tla (UponProposalInPropose's censorship branch,
\* UponQuorumOfPrecommitsAny, OnRoundCatchup, UponfPlusOneTimeoutsAny) plus
\* ServerHonestRoundSkip's own hand-rolled equivalent -- none of the other
\* four apply once f+1 is ablated and the stall isn't the Byzantine-silent-
\* leader case. So the ablation should still be able to violate
\* EventualDecisionUnderGSTLiveness; MC_Proposer's round-robin schedule puts
\* an honest proposer at round 1 (n2), right after round 0's Byzantine
\* proposer (n1) -- MAX_ROUND=2 is the minimum needed to reach that honest
\* round and still have a target round to fast-forward toward.
\*
\* The original MAX_ROUND=4/MAX_TIMESTAMP=12/MAX_BTC_HEIGHT=3/
\* MAX_ENGRAM_HEIGHT=3 bounds combinatorially explore rounds/heights
\* irrelevant to this specific Tendermint-round-stall scenario (chain
\* heights don't gate GSTReached beyond state=ANCHORED, already FSMInit's
\* default). Shrinking them should let TLC reach the target stutter state
\* (or exhaust the space and refute it) far faster than 80M+ states.

SPECIFICATION MC_ServerSpec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4

    Nodes    <- MC_Nodes
    Method   <- MC_Method
    ByzantineNodes  <- MC_Byzantine
    HonestNodes     <- MC_Honest
    Proposer <- MC_Proposer

    MAX_ROUND = 2
    MAX_BTC_HEIGHT = 1
    MAX_ENGRAM_HEIGHT = 1
    MAX_TIMESTAMP = 8

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 5
    RESET_TIME = 2

    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 2
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 2
    DOWN_HYSTERESIS_THRESHOLD = 2
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1

    N = 4
    T = 1
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

\* No SYMMETRY -- see MC_Ablation_NoFastForwardLiveness.cfg's comment (found
\* to be unsound/dangerous for liveness here, now fixed in both files).

CONSTRAINT StateSpaceLimit

PROPERTIES
    EventualDecisionUnderGSTLiveness
