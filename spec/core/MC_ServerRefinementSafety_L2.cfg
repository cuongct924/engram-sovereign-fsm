INIT MC_ServerInit
NEXT MC_ServerNext

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4
    \* n5 = n5
    \* n6 = n6
    \* n7 = n7

    \* OPERATOR SUBSTITUTIONS 
    Nodes <- MC_Nodes
    Method <- MC_Method
    ByzantineNodes <- MC_Byzantine
    HonestNodes <- MC_Honest
    Proposer <- MC_Proposer

    \* NUMERIC BOUNDS 
    MAX_ROUND = 1
    MAX_BTC_HEIGHT = 1
    MAX_ENGRAM_HEIGHT = 2
    MAX_TIMESTAMP = 4

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 3
    RESET_TIME = 2

    \* FSM THRESHOLDS 
    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 1
    BTC_THRESHOLD = 1
    RECOVERY_HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 1
    DOWN_HYSTERESIS_THRESHOLD = 1
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    STABLE_WINDOW = 2
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1


    \* CONSENSUS PARAMETERS
    N = 4
    T = 1 
    \* N = 7
    \* T = 2
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

CONSTRAINT StateSpaceLimit

SYMMETRY SymmetryPerms

INVARIANTS
    FSMTypeOK
    CoreTendermintInvariant
    HybridTendermintInvariant
    CircuitBreakerSafety

    \* Sanity_NoDataWithholding
    \* Sanity_NoCensorship

    \* Sanity_NeverAttemptWithdrawalWhileLocked
    \* Sanity_NeverProposeWithheldData
    \* Sanity_NeverAttemptCrossModeDoubleSpend
    \* Sanity_NeverFlapInRecovering

PROPERTIES
    HysteresisSafety
    SuspiciousHysteresisSafety
    MonotonicitySafety
    StrictFSMTransitionSafety
    RefinementSafety

\* ALIAS MyTraceView -- disabled: unsupported by tla2tools.jar 2.19 (2024-08-08, the "latest" GitHub release); ModelConfig.class has no ALIAS keyword handling, so TLC reads the bare word as an invariant/property name and fails to parse the config. Re-enable once a TLC build with ALIAS cfg support is used.

CHECK_DEADLOCK FALSE 