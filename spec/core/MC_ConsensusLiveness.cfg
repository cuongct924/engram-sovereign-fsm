SPECIFICATION MC_Spec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    tx1 = tx1
    Nodes <- MC_Nodes
    Method <- MC_Method
    Stake <- MC_Stake
    RESET_TIME = 3
    TOTAL_STAKE = 30
    MAX_BTC_HEIGHT = 3
    K_DEEP_FINALITY = 2

PROPERTIES
    PacemakerProgress

CONSTRAINT
    StateSpaceLimit

\* No SYMMETRY here: TLC warns "Declaring symmetry during liveness
\* checking is dangerous. It might cause TLC to miss violations of the
\* stated liveness properties." PacemakerProgress is a genuine ~>
\* liveness property, not a pure safety formula, so this file is exactly
\* the dangerous case -- symmetry could hide a real counterexample.