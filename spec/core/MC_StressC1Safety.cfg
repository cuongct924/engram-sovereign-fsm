INIT MC_ServerInit
NEXT MC_ServerNext

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4

    \* OPERATOR SUBSTITUTIONS
    Nodes <- MC_Nodes
    Method <- MC_Method
    ByzantineNodes <- MC_Byzantine
    HonestNodes <- MC_Honest
    Proposer <- MC_Proposer

    \* NUMERIC BOUNDS -- C1: base topology with adversarial injection (smallest stress config)
    MAX_ROUND = 2
    MAX_BTC_HEIGHT = 2
    MAX_ENGRAM_HEIGHT = 2
    MAX_TIMESTAMP = 6

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 3
    RESET_TIME = 2

    \* FSM THRESHOLDS
    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 1
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 1
    DOWN_HYSTERESIS_THRESHOLD = 1
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1

    \* CONSENSUS PARAMETERS
    N = 4
    T = 1
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

CONSTRAINT StateSpaceLimit

SYMMETRY SymmetryPerms

INVARIANTS
    FSMTypeOK
    CoreTendermintInvariant
    HybridTendermintInvariant
    CircuitBreakerSafety

PROPERTIES
    HysteresisSafety
    SuspiciousHysteresisSafety
    MonotonicitySafety
    StrictFSMTransitionSafety
    RefinementSafety

ALIAS MyTraceView

CHECK_DEADLOCK FALSE
