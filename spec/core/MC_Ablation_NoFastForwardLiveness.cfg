SPECIFICATION MC_ServerSpec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4

    Nodes    <- MC_Nodes
    Method   <- MC_Method
    ByzantineNodes  <- MC_Byzantine
    HonestNodes     <- MC_Honest
    Proposer <- MC_Proposer

    MAX_ROUND = 4
    MAX_BTC_HEIGHT = 3
    MAX_ENGRAM_HEIGHT = 3
    MAX_TIMESTAMP = 12

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 5
    RESET_TIME = 2

    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 2
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 2
    DOWN_HYSTERESIS_THRESHOLD = 2
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1

    N = 4
    T = 1
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

\* No SYMMETRY here: TLC warns "Declaring symmetry during liveness
\* checking is dangerous. It might cause TLC to miss violations of the
\* stated liveness properties." EventualDecisionUnderGSTLiveness is a
\* genuine ~> liveness property, and MC_Proposer's round-robin schedule is
\* a fixed function of node identity (n2/n3/n4 are NOT interchangeable --
\* each is pinned to specific rounds), so SymmetryPerms over MC_Honest is
\* unsound here regardless. This file previously declared it in error
\* (found during the f+1 ablation liveness investigation); every other
\* Liveness driver in this repo already omits it for the same reason (see
\* MC_ConsensusLiveness.cfg, MC_ServerRefinementLiveness.cfg,
\* MC_StressC1Liveness.cfg).

CONSTRAINT StateSpaceLimit

PROPERTIES
    EventualDecisionUnderGSTLiveness
