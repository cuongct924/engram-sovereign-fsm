\* Straggler-targeted variant -- see MC_Ablation_NoFastForwardLiveness_Straggler.tla's
\* header. MAX_ROUND=1 is the minimum needed for the target scenario (round 0 -> 1
\* split); round 0's proposer is honest under this driver's MC_Proposer, so the
\* Byzantine-round0 bootstrap machinery never applies within this bound.

SPECIFICATION MC_ServerSpec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4

    Nodes    <- MC_Nodes
    Method   <- MC_Method
    ByzantineNodes  <- MC_Byzantine
    HonestNodes     <- MC_Honest
    Proposer <- MC_Proposer

    MAX_ROUND = 1
    MAX_BTC_HEIGHT = 1
    MAX_ENGRAM_HEIGHT = 1
    MAX_TIMESTAMP = 6

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 5
    RESET_TIME = 2

    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 2
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 2
    DOWN_HYSTERESIS_THRESHOLD = 2
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1

    N = 4
    T = 1
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

\* No SYMMETRY -- unsound for liveness here (see MC_Ablation_NoFastForwardLiveness.cfg).

CONSTRAINT StateSpaceLimit
ACTION_CONSTRAINT NoiseFree

PROPERTIES
    EventualDecisionUnderGSTLiveness
