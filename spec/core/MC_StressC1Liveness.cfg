SPECIFICATION MC_ServerSpec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4

    \* OPERATOR SUBSTITUTIONS
    Nodes    <- MC_Nodes
    Method   <- MC_Method
    ByzantineNodes  <- MC_Byzantine
    HonestNodes     <- MC_Honest
    Proposer <- MC_Proposer

    \* NUMERIC BOUNDS -- C1: base topology with adversarial injection (smallest stress config)
    MAX_ROUND = 2
    MAX_BTC_HEIGHT = 2
    MAX_ENGRAM_HEIGHT = 2
    MAX_TIMESTAMP = 4

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 3
    RESET_TIME = 2

    \* FSM THRESHOLDS
    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 2
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 2
    DOWN_HYSTERESIS_THRESHOLD = 2
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1

    \* CONSENSUS PARAMETERS
    N = 4
    T = 1
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

CONSTRAINT StateSpaceLimit

\* No SYMMETRY here -- same reasoning as MC_ServerRefinementLiveness.cfg:
\* genuine ~> liveness properties below, symmetry is unsound for this kind
\* of check per TLC's own warning.

INVARIANTS
    FSMTypeOK
    CoreTendermintInvariant
    HybridTendermintInvariant
    CircuitBreakerSafety

PROPERTIES
    ServerEventualDecisionLiveness
    ServerFSMLiveness
    EventualDecisionUnderGSTLiveness
    ForcedInclusionLiveness
    ZKProofGenerationLiveness
    PersistentEclipseResolutionLiveness
    RefinementLiveness
