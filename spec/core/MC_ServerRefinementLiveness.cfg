SPECIFICATION MC_ServerSpec

CONSTANTS
    n1 = n1
    n2 = n2
    n3 = n3
    n4 = n4
    \* n5 = n5
    \* n6 = n6
    \* n7 = n7

    \* OPERATOR SUBSTITUTIONS 
    Nodes    <- MC_Nodes
    Method   <- MC_Method
    ByzantineNodes  <- MC_Byzantine
    HonestNodes     <- MC_Honest
    Proposer <- MC_Proposer

    \* NUMERIC BOUNDS 
    MAX_ROUND = 4
    MAX_BTC_HEIGHT = 3
    MAX_ENGRAM_HEIGHT = 3
    MAX_TIMESTAMP = 12

    MAX_IGNORE_ROUNDS = 1
    MAX_CENSORSHIP_ROUNDS = 5
    RESET_TIME = 2

    \* FSM THRESHOLDS 
    SUSPICIOUS_THRESHOLD = 1
    SOVEREIGN_THRESHOLD = 2
    DA_THRESHOLD = 2
    HYSTERESIS_WAIT = 1
    SUSPICIOUS_HYSTERESIS_WAIT = 1
    MAX_SUSPICIOUS_TIME = 2
    DOWN_HYSTERESIS_THRESHOLD = 2
    MAX_DOWN_HYSTERESIS_THRESHOLD = 8
    MIN_PEERS = 2
    MIN_SUBNET_DIVERSITY = 2
    MIN_ANCHOR_PEERS = 1
    MAX_CHURN_RATE = 1
    MIN_AVG_TENURE = 1
    MAX_PEER_LATENCY = 1


    \* CONSENSUS PARAMETERS
    N = 4
    T = 1 
    \* N = 7
    \* T = 2
    MIN_TIMESTAMP = 0
    PRECISION = 1
    DELAY = 1
    TIMEOUT_DURATION = 2
    K_DEEP_FINALITY = 2

CONSTRAINT StateSpaceLimit

\* No SYMMETRY here: TLC warns "Declaring symmetry during liveness
\* checking is dangerous. It might cause TLC to miss violations of the
\* stated liveness properties." The PROPERTIES below include genuine ~>
\* liveness (ServerEventualDecisionLiveness, EventualDecisionUnderGST-
\* Liveness, ForcedInclusionLiveness, ...), not just []-only safety
\* formulas, so this file is exactly the dangerous case -- a NoError
\* result under symmetry could be silently wrong here in a way it isn't
\* for the Safety .cfg (whose PROPERTIES are all [][A]_vars action-safety,
\* not real liveness, and don't trigger this warning).

INVARIANTS
    FSMTypeOK
    CoreTendermintInvariant
    HybridTendermintInvariant
    CircuitBreakerSafety

    \* Sanity_NeverBreakCircuit
    \* Sanity_NeverRecoverFully
    \* Sanity_NeverReachGST
    \* Sanity_NeverForceTx

PROPERTIES
    ServerEventualDecisionLiveness
    ServerFSMLiveness
    EventualDecisionUnderGSTLiveness
    ForcedInclusionLiveness
    ZKProofGenerationLiveness
    PersistentEclipseResolutionLiveness
    RefinementLiveness